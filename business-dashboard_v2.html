<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
Business Dashboard
</title>

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}

body{

background:#020617;
color:white;
padding:18px;

}

.header{

text-align:center;
margin-bottom:20px;

}

.header h1{

color:#22c55e;
font-size:30px;

}

.header p{

color:#94a3b8;
margin-top:8px;

}

.card{

background:#0f172a;
border-radius:18px;
padding:18px;
margin-top:18px;

box-shadow:0 0 12px rgba(0,0,0,.3);

}

.profile{

width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
display:block;
margin:auto;
border:3px solid #22c55e;

}

.name{

text-align:center;
font-size:24px;
margin-top:12px;
font-weight:bold;

}

.service{

text-align:center;
color:#22c55e;
margin-top:5px;

}

.info{

margin-top:15px;
line-height:2;

}

.label{

color:#94a3b8;

}

.value{

color:white;
font-weight:bold;

}

.status{

display:inline-block;

padding:6px 12px;

border-radius:20px;

font-size:13px;

font-weight:bold;

margin-top:10px;

}

.verified{

background:#16a34a;

}

.pending{

background:#dc2626;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:12px;

margin-top:14px;

background:#22c55e;

color:white;

font-size:16px;

cursor:pointer;

}

.logout{

background:#ef4444;

}

textarea{

width:100%;

height:120px;

margin-top:12px;

padding:12px;

border:none;

border-radius:12px;

resize:none;

outline:none;

}

input{

width:100%;

padding:14px;

margin-top:12px;

border:none;

border-radius:12px;

outline:none;

}

.progressBox{

margin-top:18px;

}

.progressBar{

width:100%;

height:12px;

background:#1e293b;

border-radius:30px;

overflow:hidden;

margin-top:8px;

}

.progressFill{

height:100%;

width:100%;

background:#22c55e;

transition:width .5s ease;

}

.progressText{

margin-top:8px;

font-size:14px;

color:#cbd5e1;

text-align:center;

}

</style>

</head>

<body>

<div class="header">

<h1>
💼 Business Dashboard
</h1>

<p>

Welcome back to Service Connect

</p>

</div>

<div id="dashboard">

Loading...

</div>

<script>

const API="https://service-backend-jezm.onrender.com";

const businessId=
localStorage.getItem("businessId");

if(!businessId){

window.location.href=
"business-login_v2.html";

}

loadBusiness();
async function loadBusiness(){

try{

const res=await fetch(

API+"/business/"+businessId

);

const business=await res.json();

if(business.error){

alert(business.error);

window.location.href="business-login_v2.html";

return;

}

const photo=

business.profilePicture && business.profilePicture!==""

?business.profilePicture

:"https://cdn-icons-png.flaticon.com/512/149/149071.png";

const verified=

business.verified

?'<span class="status verified">✅ VERIFIED</span>'

:'<span class="status pending">⏳ PENDING APPROVAL</span>';

document.getElementById("dashboard").innerHTML = `

<div class="card">

<img class="profile"

src="${photo}">

<div class="name">

${business.name}

</div>

<div class="service">

${business.service}

</div>

<div class="info">

<div>

<span class="label">

Business Code:

</span>

<span class="value">

${business.businessCode}

</span>

</div>

<div>

<span class="label">

Phone:

</span>

<span class="value">

${business.phone}

</span>

</div>

<div>

<span class="label">

Location:

</span>

<span class="value">

${business.location}

</span>

</div>

<div>

<span class="label">

Rating:

</span>

<span class="value">

⭐ ${Number(business.rating).toFixed(1)}

(${business.reviews} Reviews)

</span>

</div>

<div>

<span class="label">

Subscription:

</span>

<span class="value" id="remainingDays">

Loading...

</span>

</div>

<div class="progressBox">

<div class="progressBar">

<div
id="progressFill"
class="progressFill">
</div>

</div>

<div
id="progressText"
class="progressText">

Checking subscription...

</div>

</div>

<div style="margin-top:10px;">

${verified}

</div>

<div
id="notificationBox"
style="margin-top:15px;
background:#1e293b;
padding:14px;
border-radius:12px;
display:none;">

<h3 style="color:#22c55e;">
🔔 Notifications
</h3>

<p id="notificationText"
style="margin-top:10px;
line-height:1.6;">
</p>

</div>

</div>

</div>

<div class="card">

<h3>

Edit Business Profile

</h3>

<input

id="profilePicture"

placeholder="Profile Image URL"

value="${business.profilePicture||""}">

<textarea

id="shortBio"

placeholder="Short Bio">${business.shortBio||""}</textarea>

<button

onclick="updateProfile()">

Save Changes

</button>

<button
id="renewBtn"
style="display:none;background:#f59e0b;"
onclick="renewSubscription()">

🔄 Renew Subscription

</button>

<button
class="logout"
onclick="logout()">

Logout

</button>

</div>

<div class="card">

<h3>📊 Business Analytics</h3>

<div style="line-height:2.2;margin-top:15px;">

<div>👀 Profile Views:
<b>${business.profileViews}</b></div>

<div>🔍 Search Appearances:
<b>${business.searchAppearances}</b></div>

<div>📞 Call Clicks:
<b>${business.callClicks}</b></div>

<div>💬 WhatsApp Clicks:
<b>${business.whatsappClicks}</b></div>

<div>🎯 Total Leads:
<b>${business.totalLeads}</b></div>

<div>🏆 Trust Score:
<b>${business.trustScore}%</b></div>

</div>

</div>

<div class="card">

<h3>

⭐ Recent Reviews

</h3>

<div id="reviewsContainer">

Loading reviews...

</div>

</div>

<div class="card"><h3>📥 My Job Requests

</h3><div id="requestContainer">Loading job requests...

</div>

</div>

<div class="card">

<h3>

📋 Customer History

</h3>

<div id="historyContainer">

Loading customer history...

</div>

</div>

`;

loadRemainingDays();

loadReviews();

loadCustomerHistory();

loadJobRequests();
}catch(err){

console.log(err);

document.getElementById("dashboard").innerHTML=

"Failed to load dashboard.";

}
}
async function loadRemainingDays(){

try{

const res = await fetch(

API + "/business/" + businessId + "/remaining-days"

);

const data = await res.json();

const element =
document.getElementById("remainingDays");

if(!element) return;

const fill =
document.getElementById("progressFill");

const text =
document.getElementById("progressText");

let percent =
(data.remainingDays / 30) * 100;

if(percent < 0){
    percent = 0;
}

fill.style.width = percent + "%";

const notifyBox =
document.getElementById("notificationBox");

const notifyText =
document.getElementById("notificationText");

const today = new Date();

const dateString =
today.toLocaleDateString();

const timeString =
today.toLocaleTimeString();

const businessName =
localStorage.getItem("businessName") || "Business Owner";

notifyBox.style.display = "block";

if(data.remainingDays > 0){

element.innerHTML =
"🟢 " + data.remainingDays + " day(s) remaining";

text.innerHTML =
"Subscription Active";

document.getElementById("renewBtn").style.display =
"none";

if(data.remainingDays <= 3){

notifyText.innerHTML =

"👋 Welcome back, <b>" +

businessName +

"</b><br><br>" +

"⚠️ Your subscription expires in <b>" +

data.remainingDays +

"</b> day(s). Please renew now to avoid service interruption.<br><br>" +

"📅 Last checked: " +

dateString +

" " +

timeString;
}else{

notifyText.innerHTML =

"👋 Welcome back, <b>" +

businessName +

"</b><br><br>" +

"✅ Your business account is active and visible to customers.<br><br>" +

"📅 Last checked: " +

dateString +

" " +

timeString;
}

}else{

element.innerHTML =
"🔴 Subscription Expired";

fill.style.width = "0%";

text.innerHTML =
"Please renew your subscription.";

document.getElementById("renewBtn").style.display =
"block";

notifyText.innerHTML =

"👋 Welcome back, <b>" +

businessName +

"</b><br><br>" +

"❌ Your subscription has expired. Customers can no longer discover your business until your subscription is renewed.<br><br>" +

"📅 Last checked: " +

dateString +

" " +

timeString;
}

}catch(err){

console.log(err);

}

}
async function loadReviews(){

const container =
document.getElementById("reviewsContainer");

if(!container) return;

container.innerHTML =
"Loading reviews...";

try{

const res = await fetch(

API + "/business/" +
businessId +
"/reviews"

);

const data = await res.json();

if(!data.reviews || data.reviews.length===0){

container.innerHTML =
"No reviews yet.";

return;

}

let html="";

data.reviews.forEach(r=>{

html += `

<div style="background:#1e293b;
padding:12px;
border-radius:10px;
margin-top:10px;">

<b>${r.studentName||"Anonymous"}</b>

<br>

⭐ ${r.rating}/5

<br><br>

${r.comment}

</div>

`;

});

container.innerHTML = html;

}catch(err){

console.log(err);

container.innerHTML =
"Unable to load reviews.";

}

}
async function loadCustomerHistory(){

const container =
document.getElementById("historyContainer");

if(!container) return;

container.innerHTML =
"Loading customer history...";

try{

const res = await fetch(

API + "/customer-history/" + businessId

);

const data = await res.json();

if(!data || data.length===0){

container.innerHTML =
"No customer history yet.";

return;

}

let html="";

data.forEach(c=>{

html += `

<div style="
background:#1e293b;
padding:12px;
border-radius:12px;
margin-top:10px;
">

<b>👤 ${c.studentName || "Anonymous"}</b>

<br>

📞 ${c.studentPhone || "No phone"}

<br>

🛠 ${c.service || "Unknown Service"}

<br>

📌 Status:
<b>${c.status}</b>

<br>

🗓 ${new Date(c.createdAt).toLocaleDateString()}

</div>

`;

});

container.innerHTML = html;

}catch(err){

console.log(err);

container.innerHTML =
"Unable to load customer history.";

}

}

async function loadJobRequests(){

const container = document.getElementById("requestContainer");

if(!container) return;

container.innerHTML = "Loading job requests...";

try{

const res = await fetch(API + "/business/" + businessId + "/requests");

const data = await res.json();

if(!data || data.length===0){

container.innerHTML = "No job requests yet.";

return;

}

let html = "";

data.forEach(r => {

html += `

<div style="background:#1e293b;padding:14px;border-radius:12px;margin-top:10px;"><b>👤 ${r.studentName || "Service Connect Visitor"}</b><br>

📞 ${r.studentPhone || "No phone provided"}<br>

🛠 ${r.service || r.message || "Service Request"}<br>

📍 ${r.location || "Unknown location"}<br>

📌 Status: <b>${r.status}</b><br>

🗓 ${new Date(r.createdAt).toLocaleString()}

<div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;"><button style="background:#16a34a;"
onclick="updateRequestStatus('${r._id}','Accepted')">

✅ Accept

</button><button style="background:#ef4444;"
onclick="updateRequestStatus('${r._id}','Declined')">

❌ Decline

</button><button style="background:#2563eb;"
onclick="contactCustomer('${r.studentPhone}','${r.studentName}','${r.service || r.message || 'Service Request'}','${r.location || 'your area'}')">

💬 Contact Customer

</button>

</div>

</div>

`;

});

container.innerHTML = html;
}catch(err){

console.log(err);

container.innerHTML = "Unable to load job requests.";

}

}

async function updateRequestStatus(requestId,status){

try{

const res = await fetch(API + "/request/status",{

method:"POST",

headers:{ "Content-Type":"application/json" },

body:JSON.stringify({ requestId, status })

});

const data = await res.json();

alert(data.message || data.error);

loadJobRequests();

}catch(err){

console.log(err);

alert("Failed to update request status.");

}

}
async function renewSubscription(){

const businessCode =
localStorage.getItem("businessCode") || "";

const businessName =
localStorage.getItem("businessName") || "";

const message =

`Hello Admin,

I want to renew my Service Connect subscription.

Business Name:
${businessName}

Business Code:
${businessCode}

Please verify my payment after I send the payment proof.

Thank you.`;

window.open(

"https://wa.me/2348107661212?text="+
encodeURIComponent(message),

"_blank"

);

}
async function updateProfile(){

const profilePicture=
document.getElementById("profilePicture").value.trim();

const shortBio=
document.getElementById("shortBio").value.trim();

try{

const res=await fetch(

API+"/business/updateProfile",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

id:businessId,

profilePicture,

shortBio

})

}

);

const data=await res.json();

alert(data.message||data.error);

loadBusiness();

}catch(err){

console.log(err);

alert("Profile update failed.");

}

}

function contactCustomer(phone,name,service,location){

if(!phone || phone===""){

alert("Customer phone number is not available yet.");

return;

}

let number = phone;

if(number.startsWith("0")){

number = "234" + number.substring(1);

}

const businessName =
localStorage.getItem("businessName") || "Service Connect Professional";

const message =

`Hello ${name || "Customer"},

I received your request for ${service} in ${location}.

I am ${businessName} and I’m available to assist you.

Please let me know the exact issue and your preferred time.`;

window.open(

"https://wa.me/" + number + "?text=" +
encodeURIComponent(message),

"_blank"

);

}

function logout(){

localStorage.removeItem("businessId");

localStorage.removeItem("businessCode");

localStorage.removeItem("businessName");

window.location.href="business-login_v2.html";

}

</script>

</body>

</html>
