<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
Business Dashboard
</title>

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}

body{

background:#020617;
color:white;
padding:18px;

}

.header{

text-align:center;
margin-bottom:20px;

}

.header h1{

color:#22c55e;
font-size:30px;

}

.header p{

color:#94a3b8;
margin-top:8px;

}

.card{

background:#0f172a;
border-radius:18px;
padding:18px;
margin-top:18px;

box-shadow:0 0 12px rgba(0,0,0,.3);

}

.profile{

width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
display:block;
margin:auto;
border:3px solid #22c55e;

}

.name{

text-align:center;
font-size:24px;
margin-top:12px;
font-weight:bold;

}

.service{

text-align:center;
color:#22c55e;
margin-top:5px;

}

.info{

margin-top:15px;
line-height:2;

}

.label{

color:#94a3b8;

}

.value{

color:white;
font-weight:bold;

}

.status{

display:inline-block;

padding:6px 12px;

border-radius:20px;

font-size:13px;

font-weight:bold;

margin-top:10px;

}

.verified{

background:#16a34a;

}

.pending{

background:#dc2626;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:12px;

margin-top:14px;

background:#22c55e;

color:white;

font-size:16px;

cursor:pointer;

}

.logout{

background:#ef4444;

}

textarea{

width:100%;

height:120px;

margin-top:12px;

padding:12px;

border:none;

border-radius:12px;

resize:none;

outline:none;

}

input{

width:100%;

padding:14px;

margin-top:12px;

border:none;

border-radius:12px;

outline:none;

}

.progressBox{

margin-top:18px;

}

.progressBar{

width:100%;

height:12px;

background:#1e293b;

border-radius:30px;

overflow:hidden;

margin-top:8px;

}

.progressFill{

height:100%;

width:100%;

background:#22c55e;

transition:width .5s ease;

}

.progressText{

margin-top:8px;

font-size:14px;

color:#cbd5e1;

text-align:center;

}

</style>

</head>

<body>

<div class="header">

<div style="display:flex;justify-content:space-between;align-items:center;">

<h1>💼 Business Dashboard</h1>

<div
onclick="openNotifications()"
style="
position:relative;
font-size:28px;
cursor:pointer;
">

🔔

<span
id="notificationCount"
style="
position:absolute;
top:-8px;
right:-8px;
background:red;
color:white;
font-size:11px;
padding:2px 6px;
border-radius:50%;
display:none;
">
0
</span>

</div>

</div>

<p>Welcome back to Service Connect</p>

</div>

<div id="dashboard">

Loading...

</div>

<script>

const API="https://service-backend-jezm.onrender.com";

const businessId=
localStorage.getItem("businessId");

if(!businessId){

window.location.href=
"business-login_v2.html";

}

loadBusiness();

setInterval(()=>{

loadNotificationBadge();

loadQuickMenuCounts();

loadJobRequests();

loadBusinessAnalytics();

},5000);
async function loadBusiness(){

try{

const res=await fetch(

API+"/business/"+businessId

);

const business=await res.json();

if(business.error){

alert(business.error);

window.location.href="business-login_v2.html";

return;

}

const photo=

business.profilePicture && business.profilePicture!==""

?business.profilePicture

:"https://cdn-icons-png.flaticon.com/512/149/149071.png";

const verified=

business.verified

?'<span class="status verified">✅ VERIFIED</span>'

:'<span class="status pending">⏳ PENDING APPROVAL</span>';

document.getElementById("dashboard").innerHTML = `

<div class="card">

<img class="profile"

src="${photo}">

<div class="name">

${business.name}

</div>

<div class="service">

${business.service}

</div>

<div class="info">

<div>

<span class="label">

Business Code:

</span>

<span class="value">

${business.businessCode}

</span>

</div>

<div>

<span class="label">

Phone:

</span>

<span class="value">

${business.phone}

</span>

</div>

<div>

<span class="label">

Location:

</span>

<span class="value">

${business.location}

</span>

</div>

<div>

<span class="label">

Rating:

</span>

<span class="value">

⭐ ${Number(business.rating).toFixed(1)}

(${business.reviews} Reviews)

</span>

</div>

<div>

<span class="label">

Subscription:

</span>

<span class="value" id="remainingDays">

Loading...

</span>

</div>

<div class="progressBox">

<div class="progressBar">

<div
id="progressFill"
class="progressFill">
</div>

</div>

<div
id="progressText"
class="progressText">

Checking subscription...

</div>

</div>

<div style="margin-top:10px;">

${verified}

</div>

<div
id="notificationBox"
style="margin-top:15px;
background:#1e293b;
padding:14px;
border-radius:12px;
display:none;">

<h3 style="color:#22c55e;">
🔔 Notifications
</h3>

<p id="notificationText"
style="margin-top:10px;
line-height:1.6;">
</p>

</div>

</div>

</div>

<div class="card">

<h3>

Edit Business Profile

</h3>

<input

id="profilePicture"

placeholder="Profile Image URL"

value="${business.profilePicture||""}">

<textarea

id="shortBio"

placeholder="Short Bio">${business.shortBio||""}</textarea>

<button

onclick="updateProfile()">

Save Changes

</button>

<button
id="renewBtn"
style="display:none;background:#f59e0b;"
onclick="renewSubscription()">

🔄 Renew Subscription

</button>

<button
class="logout"
onclick="logout()">

Logout

</button>

</div>

<div class="card">

<h3>📊 Business Analytics</h3>

<div style="line-height:2.2;margin-top:15px;">

<div>👀 Profile Views:
<b id="analyticsViews">${business.profileViews}</b></div>

<div>🔍 Search Appearances:
<b id="analyticsSearch">${business.searchAppearances}</b></div>

<div>📞 Call Clicks:
<b id="analyticsCalls">${business.callClicks}</b></div>

<div>💬 WhatsApp Clicks:
<b id="analyticsWhatsapp">${business.whatsappClicks}</b></div>

<div>🎯 Total Leads:
<b id="analyticsLeads">${business.totalLeads}</b></div>

<div>✅ Jobs Completed:
<b id="analyticsJobs">${business.jobsCompleted}</b></div>

<div>🏆 Trust Score:
<b id="analyticsTrust">${business.trustScore}%</b></div>

</div>

</div>

<div class="card">

<h3 style="margin-bottom:15px;">
📂 Quick Menu
</h3>

<button onclick="location.href='my-job-requests.html'">
📥 My Job Requests
<span id="requestCount"></span>
</button>

<button onclick="location.href='my-reviews.html'">
⭐ Recent Reviews
<span id="reviewCount"></span>
</button>

<button onclick="location.href='customer-history.html'">
📋 Customer History
<span id="historyCount"></span>
</button>

</div>

`;

loadRemainingDays();

loadReviews();

loadCustomerHistory();

loadJobRequests();

loadQuickMenuCounts();

loadNotificationBadge();

}catch(err){

console.log(err);

document.getElementById("dashboard").innerHTML=

"Failed to load dashboard.";

}
}
async function loadRemainingDays(){

try{

const res = await fetch(

API + "/business/" + businessId + "/remaining-days"

);

const data = await res.json();

const element =
document.getElementById("remainingDays");

if(!element) return;

const fill =
document.getElementById("progressFill");

const text =
document.getElementById("progressText");

let percent =
(data.remainingDays / 30) * 100;

if(percent < 0){
    percent = 0;
}

fill.style.width = percent + "%";

const notifyBox =
document.getElementById("notificationBox");

const notifyText =
document.getElementById("notificationText");

const today = new Date();

const dateString =
today.toLocaleDateString();

const timeString =
today.toLocaleTimeString();

const businessName =
localStorage.getItem("businessName") || "Business Owner";

notifyBox.style.display = "block";

if(data.remainingDays > 0){

element.innerHTML =
"🟢 " + data.remainingDays + " day(s) remaining";

text.innerHTML =
"Subscription Active";

document.getElementById("renewBtn").style.display =
"none";

if(data.remainingDays <= 3){

notifyText.innerHTML =

"👋 Welcome back, <b>" +

businessName +

"</b><br><br>" +

"⚠️ Your subscription expires in <b>" +

data.remainingDays +

"</b> day(s). Please renew now to avoid service interruption.<br><br>" +

"📅 Last checked: " +

dateString +

" " +

timeString;
}else{

notifyText.innerHTML =

"👋 Welcome back, <b>" +

businessName +

"</b><br><br>" +

"✅ Your business account is active and visible to customers.<br><br>" +

"📅 Last checked: " +

dateString +

" " +

timeString;
}

}else{

element.innerHTML =
"🔴 Subscription Expired";

fill.style.width = "0%";

text.innerHTML =
"Please renew your subscription.";

document.getElementById("renewBtn").style.display =
"block";

notifyText.innerHTML =

"👋 Welcome back, <b>" +

businessName +

"</b><br><br>" +

"❌ Your subscription has expired. Customers can no longer discover your business until your subscription is renewed.<br><br>" +

"📅 Last checked: " +

dateString +

" " +

timeString;
}

}catch(err){

console.log(err);

}

}

async function loadQuickMenuCounts(){

try{

const requests =
await fetch(API+"/business/"+businessId+"/requests/count");
const requestData = await requests.json();

const reviews =
await fetch(API+"/business/"+businessId+"/reviews/count");
const reviewData = await reviews.json();

const history =
await fetch(API+"/business/"+businessId+"/history/count");
const historyData = await history.json();

document.getElementById("requestCount").innerHTML =
requestData.count > 0
? ` 🔴 ${requestData.count}`
: "";

document.getElementById("reviewCount").innerHTML =
reviewData.count > 0
? ` 🔴 ${reviewData.count}`
: "";

document.getElementById("historyCount").innerHTML =
historyData.count > 0
? ` 🔴 ${historyData.count}`
: "";

}catch(err){

console.log(err);

}

}

async function loadBusinessAnalytics(){

try{

const res = await fetch(API + "/business/" + businessId);

const business = await res.json();

document.getElementById("analyticsViews").innerHTML =
business.profileViews;

document.getElementById("analyticsSearch").innerHTML =
business.searchAppearances;

document.getElementById("analyticsCalls").innerHTML =
business.callClicks;

document.getElementById("analyticsWhatsapp").innerHTML =
business.whatsappClicks;

document.getElementById("analyticsLeads").innerHTML =
business.totalLeads;

document.getElementById("analyticsJobs").innerHTML =
business.jobsCompleted;

document.getElementById("analyticsTrust").innerHTML =
business.trustScore + "%";

}catch(err){

console.log(err);

}

}

async function loadReviews(){

const container =
document.getElementById("reviewsContainer");

if(!container) return;

container.innerHTML =
"Loading reviews...";

try{

const res = await fetch(

API + "/business/" +
businessId +
"/reviews"

);

const data = await res.json();

if(!data.reviews || data.reviews.length===0){

container.innerHTML =
"No reviews yet.";

return;

}

let html="";

data.reviews.forEach(r=>{

html += `

<div style="background:#1e293b;
padding:12px;
border-radius:10px;
margin-top:10px;">

<b>${r.studentName||"Anonymous"}</b>

<br>

⭐ ${r.rating}/5

<br><br>

${r.comment}

</div>

`;

});

container.innerHTML = html;

}catch(err){

console.log(err);

container.innerHTML =
"Unable to load reviews.";

}

}
async function loadCustomerHistory(){

const container =
document.getElementById("historyContainer");

if(!container) return;

container.innerHTML =
"Loading customer history...";

try{

const res = await fetch(

API + "/customer-history/" + businessId

);

const data = await res.json();

if(!data || data.length===0){

container.innerHTML =
"No customer history yet.";

return;

}

let html="";

data.forEach(c=>{

html += `

<div style="
background:#1e293b;
padding:12px;
border-radius:12px;
margin-top:10px;
">

<b>👤 ${c.studentName || "Anonymous"}</b>

<br>

📞 ${c.studentPhone || "No phone"}

<br>

🛠 ${c.service || "Unknown Service"}

<br>

📌 Status:
<b>${c.status}</b>

<br>

🗓 ${new Date(c.createdAt).toLocaleDateString()}

</div>

`;

});

container.innerHTML = html;

}catch(err){

console.log(err);

container.innerHTML =
"Unable to load customer history.";

}

}

async function loadJobRequests(){

const container = document.getElementById("requestContainer");

if(!container) return;

container.innerHTML = "Loading job requests...";

try{

const res = await fetch(API + "/business/" + businessId + "/requests");

const data = await res.json();

await fetch(

API + "/business/" + businessId + "/requests/viewed",

{

method:"POST"

}

);

loadQuickMenuCounts();

if(!data || data.length===0){

container.innerHTML = "No job requests yet.";

return;

}

let html = "";

data.forEach(r=>{

let buttons = "";

if(r.status==="Pending"){

buttons = `
<button style="background:#16a34a;"
onclick="updateRequestStatus('${r._id}','Accepted')">
✅ Accept
</button>

<button style="background:#ef4444;"
onclick="updateRequestStatus('${r._id}','Declined')">
❌ Decline
</button>
`;

}

else if(r.status==="Accepted"){

buttons = `
<button style="background:#22c55e;" disabled>
🟢 Accepted
</button>

<button style="background:#2563eb;"
onclick="contactCustomer(
'${r.studentPhone}',
'${r.studentName}',
'${r.service || r.message}',
'${r.location}'
)">
💬 Contact Customer
</button>

<button style="background:#f59e0b;"
onclick="completeJob('${r._id}')">
🏆 Mark Job Completed
</button>
`;

}

else if(r.status==="Completed"){

buttons = `
<button style="background:#16a34a;" disabled>
✅ Job Completed
</button>
`;

}

else if(r.status==="Declined"){

buttons = `
<button style="background:#ef4444;" disabled>
❌ Request Declined
</button>
`;

}

html += `

<div style="background:#1e293b;padding:14px;border-radius:12px;margin-top:12px;">

<b>👤 ${r.studentName || "Service Connect Visitor"}</b><br>

📞 ${r.studentPhone || "No phone provided"}<br>

🛠 ${r.service || r.message || "Service Request"}<br>

📍 ${r.location || "Unknown location"}<br>

📌 Status:
<b>${r.status}</b><br>

🗓 ${new Date(r.createdAt).toLocaleString()}

<div style="margin-top:14px;display:flex;flex-direction:column;gap:10px;">

${buttons}

</div>

</div>

`;

});

container.innerHTML = html;

}catch(err){

console.log(err);

container.innerHTML = "Unable to load job requests.";

}

}

async function updateRequestStatus(requestId,status){

try{

const res = await fetch(API + "/request/status",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

requestId:requestId,

status:status

})

});


const data = await res.json();


alert(data.message || data.error);


loadJobRequests();


}catch(err){

console.log(err);

alert("Failed to update request.");

}

}

async function renewSubscription(){

const businessCode =
localStorage.getItem("businessCode") || "";

const businessName =
localStorage.getItem("businessName") || "";

const message =

`Hello Admin,

I want to renew my Service Connect subscription.

Business Name:
${businessName}

Business Code:
${businessCode}

Please verify my payment after I send the payment proof.

Thank you.`;

window.open(

"https://wa.me/2348107661212?text="+
encodeURIComponent(message),

"_blank"

);

}
async function updateProfile(){

const profilePicture=
document.getElementById("profilePicture").value.trim();

const shortBio=
document.getElementById("shortBio").value.trim();

try{

const res=await fetch(

API+"/business/updateProfile",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

id:businessId,

profilePicture,

shortBio

})

}

);

const data=await res.json();

alert(data.message||data.error);

loadBusiness();

}catch(err){

console.log(err);

alert("Profile update failed.");

}

}

function contactCustomer(phone,name,service,location){

if(!phone || phone===""){

alert("Customer phone number is not available yet.");

return;

}

let number = phone;

if(number.startsWith("0")){

number = "234" + number.substring(1);

}

const businessName =
localStorage.getItem("businessName") || "Service Connect Professional";

const message =

`Hello ${name || "Customer"},

I received your request for ${service} in ${location}.

I am ${businessName} and I’m available to assist you.

Please let me know the exact issue and your preferred time.`;

window.open(

"https://wa.me/" + number + "?text=" +
encodeURIComponent(message),

"_blank"

);

}

async function completeJob(requestId){

try{


const res = await fetch(API+"/request/complete",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

requestId

})

});


const data = await res.json();

alert(data.message || data.error);

loadJobRequests();

loadQuickMenuCounts();

loadNotificationBadge();

loadRemainingDays();

}catch(err){

console.log(err);

alert("Failed to complete job");

}

}

async function loadNotificationBadge(){

try{

const res=await fetch(
API+"/notifications/business/"+businessId
);

const data=await res.json();

const badge=document.getElementById("notificationCount");

const unread = data.filter(n => !n.read);

if(unread.length > 0){

    badge.style.display = "block";
    badge.innerHTML = unread.length;

}else{

    badge.style.display = "none";
    badge.innerHTML = "0";

}

}catch(err){

console.log(err);

}

}

async function openNotifications(){

document.getElementById("notificationModal").style.display="block";

const list=document.getElementById("notificationList");

list.innerHTML="Loading...";

try{

await fetch(
API+"/notifications/business/"+businessId+"/read",
{
method:"POST"
}
);

const res=await fetch(
API+"/notifications/business/"+businessId
);

const data=await res.json();

document.getElementById("notificationCount").style.display="none";

if(data.length===0){

list.innerHTML="No notifications.";

return;

}

let html="";

data.forEach(n=>{

html+=`

<div style="
background:#1e293b;
padding:12px;
border-radius:12px;
margin-bottom:12px;
">

<b>${n.title}</b>

<br><br>

${n.message}

<br><br>

<small style="color:#94a3b8;">
${new Date(n.createdAt).toLocaleString()}
</small>

</div>

`;

});

list.innerHTML=html;

}catch(err){

console.log(err);

list.innerHTML="Unable to load notifications.";

}

}

function closeNotifications(){

document.getElementById("notificationModal").style.display="none";

}

function logout(){

localStorage.removeItem("businessId");

localStorage.removeItem("businessCode");

localStorage.removeItem("businessName");

window.location.href="business-login_v2.html";

}

</script>

<div
id="notificationModal"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
z-index:999;
">

<div
style="
background:#0f172a;
width:90%;
max-width:500px;
margin:60px auto;
padding:20px;
border-radius:15px;
max-height:80%;
overflow:auto;
">

<h2>🔔 Notifications</h2>

<div
id="notificationList"
style="margin-top:20px;">
Loading...
</div>

<button
onclick="closeNotifications()"
style="background:#ef4444;">
Close
</button>

</div>

</div>

</body>

</html>
