<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
Business Dashboard
</title>

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}

body{

background:#020617;
color:white;
padding:18px;

}

.header{

text-align:center;
margin-bottom:20px;

}

.header h1{

color:#22c55e;
font-size:30px;

}

.header p{

color:#94a3b8;
margin-top:8px;

}

.card{

background:#0f172a;
border-radius:18px;
padding:18px;
margin-top:18px;

box-shadow:0 0 12px rgba(0,0,0,.3);

}

.profile{

width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
display:block;
margin:auto;
border:3px solid #22c55e;

}

.name{

text-align:center;
font-size:24px;
margin-top:12px;
font-weight:bold;

}

.service{

text-align:center;
color:#22c55e;
margin-top:5px;

}

.info{

margin-top:15px;
line-height:2;

}

.label{

color:#94a3b8;

}

.value{

color:white;
font-weight:bold;

}

.status{

display:inline-block;

padding:6px 12px;

border-radius:20px;

font-size:13px;

font-weight:bold;

margin-top:10px;

}

.verified{

background:#16a34a;

}

.pending{

background:#dc2626;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:12px;

margin-top:14px;

background:#22c55e;

color:white;

font-size:16px;

cursor:pointer;

}

.logout{

background:#ef4444;

}

textarea{

width:100%;

height:120px;

margin-top:12px;

padding:12px;

border:none;

border-radius:12px;

resize:none;

outline:none;

}

input{

width:100%;

padding:14px;

margin-top:12px;

border:none;

border-radius:12px;

outline:none;

}

.progressBox{

margin-top:18px;

}

.progressBar{

width:100%;

height:12px;

background:#1e293b;

border-radius:30px;

overflow:hidden;

margin-top:8px;

}

.progressFill{

height:100%;

width:100%;

background:#22c55e;

transition:width .5s ease;

}

.progressText{

margin-top:8px;

font-size:14px;

color:#cbd5e1;

text-align:center;

}

</style>

</head>

<body>

<div class="header">

<h1>
💼 Business Dashboard
</h1>

<p>

Welcome back to Service Connect

</p>

</div>

<div id="dashboard">

Loading...

</div>

<script>

const API="https://service-backend-jezm.onrender.com";

const businessId=
localStorage.getItem("businessId");

if(!businessId){

window.location.href=
"business-login_v2.html";

}

loadBusiness();
async function loadBusiness(){

try{

const res=await fetch(

API+"/business/"+businessId

);

const business=await res.json();

if(business.error){

alert(business.error);

window.location.href="business-login_v2.html";

return;

}

const photo=

business.profilePicture && business.profilePicture!==""

?business.profilePicture

:"https://cdn-icons-png.flaticon.com/512/149/149071.png";

const verified=

business.verified

?'<span class="status verified">✅ VERIFIED</span>'

:'<span class="status pending">⏳ PENDING APPROVAL</span>';

document.getElementById("dashboard").innerHTML = `

<div class="card">

<img class="profile"

src="${photo}">

<div class="name">

${business.name}

</div>

<div class="service">

${business.service}

</div>

<div class="info">

<div>

<span class="label">

Business Code:

</span>

<span class="value">

${business.businessCode}

</span>

</div>

<div>

<span class="label">

Phone:

</span>

<span class="value">

${business.phone}

</span>

</div>

<div>

<span class="label">

Location:

</span>

<span class="value">

${business.location}

</span>

</div>

<div>

<span class="label">

Rating:

</span>

<span class="value">

⭐ ${Number(business.rating).toFixed(1)}

(${business.reviews} Reviews)

</span>

</div>

<div>

<span class="label">

Subscription:

</span>

<span class="value" id="remainingDays">

Loading...

</span>

</div>

<div class="progressBox">

<div class="progressBar">

<div
id="progressFill"
class="progressFill">
</div>

</div>

<div
id="progressText"
class="progressText">

Checking subscription...

</div>

</div>

<div style="margin-top:10px;">

${verified}

</div>

<div
id="notificationBox"
style="margin-top:15px;
background:#1e293b;
padding:14px;
border-radius:12px;
display:none;">

<h3 style="color:#22c55e;">
🔔 Notifications
</h3>

<p id="notificationText"
style="margin-top:10px;
line-height:1.6;">
</p>

</div>

</div>

</div>

<div class="card">

<h3>

Edit Business Profile

</h3>

<input

id="profilePicture"

placeholder="Profile Image URL"

value="${business.profilePicture||""}">

<textarea

id="shortBio"

placeholder="Short Bio">${business.shortBio||""}</textarea>

<button

onclick="updateProfile()">

Save Changes

</button>

<button
id="renewBtn"
style="display:none;background:#f59e0b;"
onclick="renewSubscription()">

🔄 Renew Subscription

</button>

<button
class="logout"
onclick="logout()">

Logout

</button>

</div>

`;
loadRemainingDays();
}catch(err){

console.log(err);

document.getElementById("dashboard").innerHTML=

"Failed to load dashboard.";

}
}
async function loadRemainingDays(){

try{

const res = await fetch(

API + "/business/" + businessId + "/remaining-days"

);

const data = await res.json();

const element =
document.getElementById("remainingDays");

if(!element) return;

const fill =
document.getElementById("progressFill");

const text =
document.getElementById("progressText");

let percent =
(data.remainingDays / 30) * 100;

if(percent < 0){
    percent = 0;
}

fill.style.width = percent + "%";

const notifyBox =
document.getElementById("notificationBox");

const notifyText =
document.getElementById("notificationText");

notifyBox.style.display = "block";

if(data.remainingDays > 0){

element.innerHTML =
"🟢 " + data.remainingDays + " day(s) remaining";

text.innerHTML =
"Subscription Active";

document.getElementById("renewBtn").style.display =
"none";

if(data.remainingDays <= 3){

notifyText.innerHTML =
"⚠️ Your subscription will expire in <b>"
+ data.remainingDays +
"</b> day(s). Please renew now to avoid interruption.";

}else{

notifyText.innerHTML =
"✅ Your business account is active and visible to customers. Keep delivering excellent service.";

}

}else{

element.innerHTML =
"🔴 Subscription Expired";

fill.style.width = "0%";

text.innerHTML =
"Please renew your subscription.";

document.getElementById("renewBtn").style.display =
"block";

notifyText.innerHTML =
"❌ Your subscription has expired. Customers can no longer find your business until you renew.";

}

}catch(err){

console.log(err);

}

}
async function renewSubscription(){

const businessCode =
localStorage.getItem("businessCode") || "";

const businessName =
localStorage.getItem("businessName") || "";

const message =

`Hello Admin,

I want to renew my Service Connect subscription.

Business Name:
${businessName}

Business Code:
${businessCode}

Please verify my payment after I send the payment proof.

Thank you.`;

window.open(

"https://wa.me/2348107661212?text="+
encodeURIComponent(message),

"_blank"

);

}
async function updateProfile(){

const profilePicture=
document.getElementById("profilePicture").value.trim();

const shortBio=
document.getElementById("shortBio").value.trim();

try{

const res=await fetch(

API+"/business/updateProfile",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

id:businessId,

profilePicture,

shortBio

})

}

);

const data=await res.json();

alert(data.message||data.error);

loadBusiness();

}catch(err){

console.log(err);

alert("Profile update failed.");

}

}

function logout(){

localStorage.removeItem("businessId");

localStorage.removeItem("businessCode");

localStorage.removeItem("businessName");

window.location.href="business-login_v2.html";

}

</script>

</body>

</html>
