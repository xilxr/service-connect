<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Messages</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#ffffff;
  color:#111827;
  font-family:Arial,sans-serif;
}

h2{
  background:#075e54;
  color:white;
  margin:0;
  padding:22px 16px;
  text-align:left;
  font-size:23px;
}

#conversationList{
  padding:8px 0;
}

.conversation{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px;
  border-bottom:1px solid #e5e7eb;
  cursor:pointer;
}

.avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#d1fae5;
  color:#075e54;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
  flex-shrink:0;
}

.conversationInfo{
  flex:1;
  min-width:0;
}

.conversationName{
  font-size:17px;
  font-weight:bold;
}

.lastMessage{
  color:#667781;
  font-size:14px;
  margin-top:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.conversationMeta{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:8px;
}

.messageTime{
  color:#667781;
  font-size:12px;
}

.unreadBadge{
  background:#25d366;
  color:white;
  border-radius:50%;
  min-width:21px;
  height:21px;
  padding:3px;
  text-align:center;
  font-size:12px;
  font-weight:bold;
}
</style>

</head>

<body>

<h2>💬 SERVICE CONNECT</h2>

<div id="conversationList">

Loading conversations...

</div>

<script>

const API="https://service-backend-jezm.onrender.com";

const businessId=
localStorage.getItem("businessId");

loadConversations();

setInterval(loadConversations, 5000);

async function loadConversations(){

try{

const res = await fetch(

API+"/business/"+businessId+"/requests"

);

const requests = await res.json();

const uniqueRequests = [];

const seen = {};

requests.forEach(r=>{

if(!seen[r.studentPhone]){

seen[r.studentPhone]=true;

uniqueRequests.push(r);

}

});

const list =
document.getElementById("conversationList");

if(!requests.length){

list.innerHTML="No conversations yet.";

return;

}

let html="";

uniqueRequests.forEach(r=>{

html += `

<div class="conversation"
onclick="openChat('${r._id}','${r.studentName}')">

<div class="avatar">
${(r.studentName || "S").charAt(0).toUpperCase()}
</div>

<div class="conversationInfo">

<div class="conversationName">
${r.studentName || "Student"}
</div>

<div class="lastMessage" id="preview-${r._id}">
${r.service || "Tap to open conversation"}
</div>

</div>

<div class="conversationMeta">
<div class="messageTime" id="time-${r._id}"></div>
<div id="unread-${r._id}"></div>
</div>

</div>

`;

});

list.innerHTML = html;

for(const r of uniqueRequests){

try{

const response = await fetch(
API+"/chat/last/"+r._id
);

const lastMessage = await response.json();

const row = document.getElementById(
"preview-"+r._id
);

const time = document.getElementById(
"time-"+r._id
);

const unreadBox = document.getElementById(
"unread-"+r._id
);

const messagesResponse = await fetch(
API+"/chat/messages/"+r._id
);

const messages = await messagesResponse.json();

const unreadCount = messages.filter(m =>
m.senderType === "student" && m.read === false
).length;

if(unreadBox){
unreadBox.innerHTML = unreadCount > 0
? `<span class="unreadBadge">${unreadCount}</span>`
: "";
}

if(lastMessage.message){

if(row){
row.textContent = lastMessage.message;
}

if(time){
time.textContent = new Date(
lastMessage.createdAt
).toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});
}

}

}catch(err){
console.log(err);
}

}

}catch(err){
console.log("Error loading conversations:",err);
document.getElementById("conversationList").textContent =
"Unable to load conversations. Please refresh.";
}

}

function openChat(requestId,name){

localStorage.setItem(

"chatCustomerName",

name

);

window.location.href=

"business-chat.html?requestId="+requestId;

}

</script>

</body>

</html>
