<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Messages</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#ffffff;
  color:#111827;
  font-family:Arial,sans-serif;
}

h2{
  background:#075e54;
  color:white;
  margin:0;
  padding:22px 16px;
  text-align:left;
  font-size:23px;
}

#conversationList{
  padding:8px 0;
}

.conversation{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px;
  border-bottom:1px solid #e5e7eb;
  cursor:pointer;
}

.avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#d1fae5;
  color:#075e54;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
  flex-shrink:0;
}

.conversationInfo{
  flex:1;
  min-width:0;
}

.conversationName{
  font-size:17px;
  font-weight:bold;
}

.lastMessage{
  color:#667781;
  font-size:14px;
  margin-top:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.conversationMeta{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:8px;
}

.messageTime{
  color:#667781;
  font-size:12px;
}

.unreadBadge{
  background:#25d366;
  color:white;
  border-radius:50%;
  min-width:21px;
  height:21px;
  padding:3px;
  text-align:center;
  font-size:12px;
  font-weight:bold;
}
</style>

</head>

<body>

<h2>💬 SERVICE CONNECT</h2>

<div id="conversationList">

Loading conversations...

</div>

<script>

const API="https://service-backend-jezm.onrender.com";

/* =========================================
   BUSINESS LOGIN PROTECTION
========================================= */

const businessId =
  localStorage.getItem("businessId");

let isLoadingConversations = false;

function getBusinessAuthToken() {

  return localStorage.getItem("businessToken") || "";

}

function hasValidBusinessSession() {

  const token = getBusinessAuthToken();

  return (

    typeof businessId === "string" &&

    /^[a-f0-9]{24}$/i.test(businessId) &&

    localStorage.getItem("businessId") === businessId &&

    token.trim().length > 0

  );

}

async function loadConversations(){

/* =========================================
   AUTHENTICATED CONVERSATION LOADING
========================================= */

const token = getBusinessAuthToken();

if (!hasValidBusinessSession()) {

  window.location.replace(
    "business-login_v2.html"
  );

  return;

}

if (isLoadingConversations) return;

isLoadingConversations = true;

try {

  const res = await fetch(

    API + "/business/" +
    encodeURIComponent(businessId) +
    "/requests",

    {

      method: "GET",

      headers: {

        "Authorization": "Bearer " + token

      }

    }

  );

  /* Prevent outdated session responses */

  if (

    getBusinessAuthToken() !== token ||

    localStorage.getItem("businessId") !== businessId

  ) {

    return;

  }

  /* Handle expired or invalid sessions */

  if (res.status === 401) {

    window.location.replace(
      "business-login_v2.html"
    );

    return;

  }

  /* Handle unauthorized access */

  if (res.status === 403) {

    document.getElementById(
      "conversationList"
    ).textContent =
      "You are not authorized to access these conversations.";

    return;

  }

  /* Validate HTTP response */

  if (!res.ok) {

    throw new Error(
      "Unable to load conversations."
    );

  }

  const requests = await res.json();

  /* Verify session after reading response */

  if (

    getBusinessAuthToken() !== token ||

    localStorage.getItem("businessId") !== businessId

  ) {

    return;

  }

  /* Validate conversation response */

  if (!Array.isArray(requests)) {

    throw new Error(
      "Invalid conversation response."
    );

  }

/* =========================================
   SECURE CONVERSATION GROUPING
========================================= */

const uniqueRequests = [];

const seenRequestIds = new Set();

requests.forEach(r => {

  /* Validate request record */

  if (

    !r ||

    typeof r._id !== "string" ||

    !/^[a-f0-9]{24}$/i.test(r._id)

  ) return;

  const requestId = r._id.toLowerCase();

  /* Prevent duplicate conversations */

  if (seenRequestIds.has(requestId)) return;

  seenRequestIds.add(requestId);

  uniqueRequests.push(r);

});

const list =
  document.getElementById("conversationList");

if (!list) return;

/* Handle empty conversation records */

if (uniqueRequests.length === 0) {

  list.textContent = "No conversations yet.";

  return;

}

/* =========================================
   SECURE CONVERSATION RENDERING
========================================= */

const fragment = document.createDocumentFragment();

uniqueRequests.forEach(r => {

  const requestId = r._id;

  /* Validate customer name */

  const studentName =

    typeof r.studentName === "string" &&
    r.studentName.trim()

      ? r.studentName.trim()

      : "Student";

  /* Validate service description */

  const serviceName =

    typeof r.service === "string" &&
    r.service.trim()

      ? r.service.trim()

      : "Tap to open conversation";

  /* Create conversation container */

  const conversation =
    document.createElement("div");

  conversation.className = "conversation";

  /* Secure conversation navigation */

  conversation.addEventListener("click", () => {

    openChat(requestId, studentName);

  });

  /* Create customer avatar */

  const avatar =
    document.createElement("div");

  avatar.className = "avatar";

  avatar.textContent =
    studentName.charAt(0).toUpperCase();

  /* Create conversation information */

  const conversationInfo =
    document.createElement("div");

  conversationInfo.className =
    "conversationInfo";

  /* Safely display customer name */

  const nameElement =
    document.createElement("div");

  nameElement.className =
    "conversationName";

  nameElement.textContent =
    studentName;

  /* Safely display message preview */

  const preview =
    document.createElement("div");

  preview.className = "lastMessage";

  preview.id = "preview-" + requestId;

  preview.textContent = serviceName;

  conversationInfo.appendChild(nameElement);

  conversationInfo.appendChild(preview);

  /* Create conversation metadata */

  const conversationMeta =
    document.createElement("div");

  conversationMeta.className =
    "conversationMeta";

  /* Create message timestamp */

  const messageTime =
    document.createElement("div");

  messageTime.className = "messageTime";

  messageTime.id = "time-" + requestId;

  /* Create unread message container */

  const unreadBox =
    document.createElement("div");

  unreadBox.id = "unread-" + requestId;

  conversationMeta.appendChild(messageTime);

  conversationMeta.appendChild(unreadBox);

  /* Assemble conversation */

  conversation.appendChild(avatar);

  conversation.appendChild(conversationInfo);

  conversation.appendChild(conversationMeta);

  fragment.appendChild(conversation);

});

/* Safely display all conversations */

list.replaceChildren(fragment);

/* =========================================
   AUTHENTICATED MESSAGE PREVIEWS
   AND UNREAD MESSAGE COUNTERS
========================================= */

for (const r of uniqueRequests) {

  /* Verify current business session */

  if (

    !hasValidBusinessSession() ||

    getBusinessAuthToken() !== token

  ) return;

  const requestId = r._id;

  try {

    /* Load latest message and conversation messages */

    const [response, messagesResponse] =
      await Promise.all([

        fetch(

          API + "/chat/last/" +
          encodeURIComponent(requestId),

          {

            method: "GET",

            headers: {

              "Authorization": "Bearer " + token

            }

          }

        ),

        fetch(

          API + "/chat/messages/" +
          encodeURIComponent(requestId),

          {

            method: "GET",

            headers: {

              "Authorization": "Bearer " + token

            }

          }

        )

      ]);

    /* Prevent outdated session responses */

    if (

      getBusinessAuthToken() !== token ||

      localStorage.getItem("businessId") !== businessId

    ) return;

    /* Handle expired or invalid sessions */

    if (

      response.status === 401 ||

      messagesResponse.status === 401

    ) {

      window.location.replace(
        "business-login_v2.html"
      );

      return;

    }

    /* Prevent unauthorized conversation access */

    if (

      response.status === 403 ||

      messagesResponse.status === 403

    ) {

      console.warn(
        "Unauthorized conversation:",
        requestId
      );

      continue;

    }

    /* Validate HTTP responses */

    if (!response.ok || !messagesResponse.ok) {

      throw new Error(
        "Unable to load conversation messages."
      );

    }

    const [lastMessage, messages] =
      await Promise.all([

        response.json(),

        messagesResponse.json()

      ]);

    /* Verify session after reading responses */

    if (

      getBusinessAuthToken() !== token ||

      localStorage.getItem("businessId") !== businessId

    ) return;

    /* Validate response formats */

    if (

      !lastMessage ||

      typeof lastMessage !== "object" ||

      Array.isArray(lastMessage) ||

      !Array.isArray(messages)

    ) {

      throw new Error(
        "Invalid conversation message response."
      );

    }

    /* Locate conversation elements */

    const row = document.getElementById(
      "preview-" + requestId
    );

    const time = document.getElementById(
      "time-" + requestId
    );

    const unreadBox = document.getElementById(
      "unread-" + requestId
    );

    /* Count unread student messages */

    const unreadCount = messages.filter(m =>

      m &&

      m.senderType === "student" &&

      m.read === false

    ).length;

    /* Safely render unread message badge */

    if (unreadBox) {

      unreadBox.replaceChildren();

      if (unreadCount > 0) {

        const badge =
          document.createElement("span");

        badge.className = "unreadBadge";

        badge.textContent = String(unreadCount);

        unreadBox.appendChild(badge);

      }

    }

    /* Safely display latest message */

    if (

      row &&

      typeof lastMessage.message === "string" &&

      lastMessage.message.trim()

    ) {

      row.textContent = lastMessage.message;

    }

    /* Safely display message timestamp */

    if (time && lastMessage.createdAt) {

      const messageDate =
        new Date(lastMessage.createdAt);

      if (Number.isFinite(messageDate.getTime())) {

        time.textContent =
          messageDate.toLocaleTimeString([], {

            hour: "2-digit",

            minute: "2-digit"

          });

      }

    }

  } catch (err) {

    console.error(

      "CONVERSATION MESSAGE ERROR:",

      requestId,

      err

    );

  }

}

}catch(err){
console.log("Error loading conversations:",err);
document.getElementById("conversationList").textContent =
"Unable to load conversations. Please refresh.";
}finally{
isLoadingConversations = false;
}

}

/* =========================================
   SECURE BUSINESS CHAT NAVIGATION
========================================= */

function openChat(requestId, name) {

  /* Verify business session */

  if (!hasValidBusinessSession()) {

    window.location.replace(
      "business-login_v2.html"
    );

    return;

  }

  /* Validate conversation request ID */

  if (

    typeof requestId !== "string" ||

    !/^[a-f0-9]{24}$/i.test(requestId)

  ) {

    alert("Invalid conversation.");

    return;

  }

  /* Validate customer name */

  const safeCustomerName =

    typeof name === "string" &&
    name.trim()

      ? name.trim()

      : "Student";

  /* Save conversation information */

  localStorage.setItem(
    "chatRequestId",
    requestId
  );

  localStorage.setItem(
    "chatCustomerName",
    safeCustomerName
  );

  /* Open the correct conversation */

  window.location.href =

    "business-chat.html?requestId=" +

    encodeURIComponent(requestId);

}

/* =========================================
   PROTECTED BUSINESS MESSAGES
   INITIALIZATION AND AUTOMATIC REFRESH
========================================= */

if (!hasValidBusinessSession()) {

  window.location.replace(
    "business-login_v2.html"
  );

} else {

  loadConversations();

  setInterval(() => {

    /* Verify current business session */

    if (!hasValidBusinessSession()) {

      window.location.replace(
        "business-login_v2.html"
      );

      return;

    }

    /* Pause refresh when page is hidden */

    if (document.hidden) return;

    /* Prevent overlapping API requests */

    if (isLoadingConversations) return;

    /* Refresh conversations */

    loadConversations();

  }, 5000);

}

</script>

</body>

</html>
