<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Messages</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#ffffff;
  color:#111827;
  font-family:Arial,sans-serif;
}

h2{
  background:#075e54;
  color:white;
  margin:0;
  padding:22px 16px;
  text-align:left;
  font-size:23px;
}

#conversationList{
  padding:8px 0;
}

.conversation{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px;
  border-bottom:1px solid #e5e7eb;
  cursor:pointer;
}

.avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#d1fae5;
  color:#075e54;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
  flex-shrink:0;
}

.conversationInfo{
  flex:1;
  min-width:0;
}

.conversationName{
  font-size:17px;
  font-weight:bold;
}

.lastMessage{
  color:#667781;
  font-size:14px;
  margin-top:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.conversationMeta{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:8px;
}

.messageTime{
  color:#667781;
  font-size:12px;
}

.unreadBadge{
  background:#25d366;
  color:white;
  border-radius:50%;
  min-width:21px;
  height:21px;
  padding:3px;
  text-align:center;
  font-size:12px;
  font-weight:bold;
}
</style>

</head>

<body>

<h2>💬 SERVICE CONNECT</h2>

<div id="conversationList">

Loading conversations...

</div>

<script>

const API="https://service-backend-jezm.onrender.com";

/* =========================================
   BUSINESS LOGIN PROTECTION
========================================= */

const businessId =
  localStorage.getItem("businessId");

let isLoadingConversations = false;

function getBusinessAuthToken() {

  return localStorage.getItem("businessToken") || "";

}

function hasValidBusinessSession() {

  const token = getBusinessAuthToken();

  return (

    typeof businessId === "string" &&

    /^[a-f0-9]{24}$/i.test(businessId) &&

    localStorage.getItem("businessId") === businessId &&

    token.trim().length > 0

  );

}

async function loadConversations(){

/* =========================================
   AUTHENTICATED CONVERSATION LOADING
========================================= */

const token = getBusinessAuthToken();

if (!hasValidBusinessSession()) {

  window.location.replace(
    "business-login_v2.html"
  );

  return;

}

if (isLoadingConversations) return;

isLoadingConversations = true;

try {

  const res = await fetch(

    API + "/business/" +
    encodeURIComponent(businessId) +
    "/requests",

    {

      method: "GET",

      headers: {

        "Authorization": "Bearer " + token

      }

    }

  );

  /* Prevent outdated session responses */

  if (

    getBusinessAuthToken() !== token ||

    localStorage.getItem("businessId") !== businessId

  ) {

    return;

  }

  /* Handle expired or invalid sessions */

  if (res.status === 401) {

    window.location.replace(
      "business-login_v2.html"
    );

    return;

  }

  /* Handle unauthorized access */

  if (res.status === 403) {

    document.getElementById(
      "conversationList"
    ).textContent =
      "You are not authorized to access these conversations.";

    return;

  }

  /* Validate HTTP response */

  if (!res.ok) {

    throw new Error(
      "Unable to load conversations."
    );

  }

  const requests = await res.json();

  /* Verify session after reading response */

  if (

    getBusinessAuthToken() !== token ||

    localStorage.getItem("businessId") !== businessId

  ) {

    return;

  }

  /* Validate conversation response */

  if (!Array.isArray(requests)) {

    throw new Error(
      "Invalid conversation response."
    );

  }

/* =========================================
   SECURE CONVERSATION GROUPING
========================================= */

const uniqueRequests = [];

const seenRequestIds = new Set();

requests.forEach(r => {

  /* Validate request record */

  if (

    !r ||

    typeof r._id !== "string" ||

    !/^[a-f0-9]{24}$/i.test(r._id)

  ) return;

  const requestId = r._id.toLowerCase();

  /* Prevent duplicate conversations */

  if (seenRequestIds.has(requestId)) return;

  seenRequestIds.add(requestId);

  uniqueRequests.push(r);

});

const list =
  document.getElementById("conversationList");

if (!list) return;

/* Handle empty conversation records */

if (uniqueRequests.length === 0) {

  list.textContent = "No conversations yet.";

  return;

}

/* =========================================
   SECURE CONVERSATION RENDERING
========================================= */

const fragment = document.createDocumentFragment();

uniqueRequests.forEach(r => {

  const requestId = r._id;

  /* Validate customer name */

  const studentName =

    typeof r.studentName === "string" &&
    r.studentName.trim()

      ? r.studentName.trim()

      : "Student";

  /* Validate service description */

  const serviceName =

    typeof r.service === "string" &&
    r.service.trim()

      ? r.service.trim()

      : "Tap to open conversation";

  /* Create conversation container */

  const conversation =
    document.createElement("div");

  conversation.className = "conversation";

  /* Secure conversation navigation */

  conversation.addEventListener("click", () => {

    openChat(requestId, studentName);

  });

  /* Create customer avatar */

  const avatar =
    document.createElement("div");

  avatar.className = "avatar";

  avatar.textContent =
    studentName.charAt(0).toUpperCase();

  /* Create conversation information */

  const conversationInfo =
    document.createElement("div");

  conversationInfo.className =
    "conversationInfo";

  /* Safely display customer name */

  const nameElement =
    document.createElement("div");

  nameElement.className =
    "conversationName";

  nameElement.textContent =
    studentName;

  /* Safely display message preview */

  const preview =
    document.createElement("div");

  preview.className = "lastMessage";

  preview.id = "preview-" + requestId;

  preview.textContent = serviceName;

  conversationInfo.appendChild(nameElement);

  conversationInfo.appendChild(preview);

  /* Create conversation metadata */

  const conversationMeta =
    document.createElement("div");

  conversationMeta.className =
    "conversationMeta";

  /* Create message timestamp */

  const messageTime =
    document.createElement("div");

  messageTime.className = "messageTime";

  messageTime.id = "time-" + requestId;

  /* Create unread message container */

  const unreadBox =
    document.createElement("div");

  unreadBox.id = "unread-" + requestId;

  conversationMeta.appendChild(messageTime);

  conversationMeta.appendChild(unreadBox);

  /* Assemble conversation */

  conversation.appendChild(avatar);

  conversation.appendChild(conversationInfo);

  conversation.appendChild(conversationMeta);

  fragment.appendChild(conversation);

});

/* Safely display all conversations */

list.replaceChildren(fragment);

for(const r of uniqueRequests){

try{

const response = await fetch(
API+"/chat/last/"+r._id
);

const lastMessage = await response.json();

const row = document.getElementById(
"preview-"+r._id
);

const time = document.getElementById(
"time-"+r._id
);

const unreadBox = document.getElementById(
"unread-"+r._id
);

const messagesResponse = await fetch(
API+"/chat/messages/"+r._id
);

const messages = await messagesResponse.json();

const unreadCount = messages.filter(m =>
m.senderType === "student" && m.read === false
).length;

if(unreadBox){
unreadBox.innerHTML = unreadCount > 0
? `<span class="unreadBadge">${unreadCount}</span>`
: "";
}

if(lastMessage.message){

if(row){
row.textContent = lastMessage.message;
}

if(time){
time.textContent = new Date(
lastMessage.createdAt
).toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});
}

}

}catch(err){
console.log(err);
}

}

}catch(err){
console.log("Error loading conversations:",err);
document.getElementById("conversationList").textContent =
"Unable to load conversations. Please refresh.";
}finally{
isLoadingConversations = false;
}

}

function openChat(requestId,name){

localStorage.setItem(

"chatCustomerName",

name

);

window.location.href=

"business-chat.html?requestId="+requestId;

}

/* =========================================
   INITIALIZE BUSINESS MESSAGES
========================================= */

if (!hasValidBusinessSession()) {

  window.location.replace(
    "business-login_v2.html"
  );

} else {

  loadConversations();

  setInterval(() => {

    if (!hasValidBusinessSession()) {

      window.location.replace(
        "business-login_v2.html"
      );

      return;

    }

    loadConversations();

  }, 5000);

}

</script>

</body>

</html>
