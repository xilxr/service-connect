<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Business Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b141a;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
background:#075e54;
padding:18px;
display:flex;
align-items:center;
justify-content:space-between;
}

.header h2{
color:#22c55e;
font-size:22px;
}

#chatBox{
flex:1;
overflow-y:auto;
padding:15px;
}

.message{
max-width:80%;
padding:12px;
margin:10px 0;
border-radius:12px;
word-wrap:break-word;
}

.me{
background:#005c4b;
margin-left:auto;
color:white;
}

.other{
background:#202c33;
margin-right:auto;
color:white;
}

.dateSeparator{
display:table;
margin:20px auto 12px;
padding:7px 14px;
background:#182b34;
color:#d1d7db;
font-size:12px;
font-weight:bold;
border-radius:10px;
text-align:center;
box-shadow:0 1px 3px rgba(0,0,0,.2);
}

.time{
font-size:11px;
opacity:.7;
margin-top:5px;
}

.footer{
display:flex;
align-items:center;
padding:10px;
padding-bottom:max(10px, env(safe-area-inset-bottom));
background:#202c33;
gap:8px;
}

input{
flex:1;
min-width:0;
padding:12px 15px;
border:none;
border-radius:25px;
outline:none;
background:#2a3942;
color:white;
font-size:15px;
}

button{
padding:12px 18px;
border:none;
border-radius:25px;
background:#00a884;
color:white;
font-weight:bold;
cursor:pointer;
}

.back{
background:#475569;
margin:10px;
}

.chatClosedNotice{
display:none;
background:#202c33;
color:#d1d7db;
padding:18px 15px;
padding-bottom:max(18px,env(safe-area-inset-bottom));
text-align:center;
font-size:13px;
line-height:1.7;
border-top:1px solid #374151;
}

.chatClosedNotice strong{
color:#f8fafc;
font-size:15px;
}

button:disabled,
input:disabled{
opacity:.5;
cursor:not-allowed;
}

</style>

</head>

<body>

<button class="back"
onclick="history.back()">
⬅ Back
</button>

<div class="header">

<h2 id="customerName">
💬 SERVICE CONNECT
</h2>

</div>

<div id="chatBox">

Loading conversation...

</div>

<div class="footer">

<input
id="message"
placeholder="Type your message...">

<button
onclick="sendMessage()">
Send
</button>

</div>

<div id="chatClosedNotice" class="chatClosedNotice">

🔒 <strong>Service Completed</strong>

<p>
This job has been marked as completed, and this conversation is now closed.
</p>

<p>
Your previous messages remain available. If this customer hires you again, a new conversation will be created.
</p>

</div>

<script>

const API="https://service-backend-jezm.onrender.com";

const businessId=localStorage.getItem("businessId");

const params = new URLSearchParams(window.location.search);

const requestId =
params.get("requestId") ||
localStorage.getItem("chatRequestId");

const customerName=
localStorage.getItem("chatCustomerName");

let chatStudentPhone="";

async function loadChatStudent(){

try{

const res=await fetch(
API+"/request/"+encodeURIComponent(requestId)
);

if(!res.ok) return;

const request=await res.json();

if(request.businessId!==businessId){
console.error("Conversation does not belong to this business.");
return;
}

chatStudentPhone=request.studentPhone || "";

}catch(err){

console.log("Unable to load student information:",err);

}

}

loadChatStudent();

document.getElementById("customerName").textContent=
"💬 SERVICE CONNECT";

let chatLocked=false;

function lockChat(){

chatLocked=true;

document.querySelector(".footer").style.display="none";

document.getElementById("message").disabled=true;

document.querySelector(".footer button").disabled=true;

document.getElementById("chatClosedNotice").style.display="block";

}

async function checkChatStatus(){

try{

const res=await fetch(
API+"/request/"+encodeURIComponent(requestId)
);

if(!res.ok) return;

const request=await res.json();

if(request.status==="Completed"){

lockChat();

}

}catch(err){

console.log("Chat status check failed:",err);

}

}

loadMessages();
checkChatStatus();

setInterval(loadMessages,3000);
setInterval(checkChatStatus,3000);

async function loadMessages(){

try{

const res = await fetch(
API+"/chat/messages/"+requestId
);

const messages=await res.json();

await fetch(API+"/chat/read/"+requestId,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({readerType:"business"})
});

const chat=document.getElementById("chatBox");

if(!messages.length){

chat.innerHTML="No messages yet.";

return;

}

let html="";
let lastDate="";

messages.forEach(m=>{

const messageDate=new Date(m.createdAt);

const dateKey=[
messageDate.getFullYear(),
messageDate.getMonth(),
messageDate.getDate()
].join("-");

if(dateKey!==lastDate){

const today=new Date();

const yesterday=new Date(today);
yesterday.setDate(today.getDate()-1);

const sameDay=(a,b)=>
a.getFullYear()===b.getFullYear() &&
a.getMonth()===b.getMonth() &&
a.getDate()===b.getDate();

let dateLabel;

if(sameDay(messageDate,today)){
dateLabel="Today";
}else if(sameDay(messageDate,yesterday)){
dateLabel="Yesterday";
}else{
dateLabel=messageDate.toLocaleDateString("en-US",{
year:"numeric",
month:"long",
day:"numeric"
});
}

html+=`<div class="dateSeparator">${dateLabel}</div>`;

lastDate=dateKey;

}

html+=`

<div class="message ${m.senderType==="business"?"me":"other"}">

${m.message}

<div class="time" style="text-align:right">

${new Date(m.createdAt).toLocaleTimeString([], {
  hour: "2-digit",
  minute: "2-digit"
})}

${m.senderType === "business"
? (m.read
  ? '<span style="color:#00BFFF;font-weight:bold"> ✓✓</span>'
  : '<span style="color:#FFFFFF;font-weight:bold"> ✓</span>')
  : ''}

</div>

</div>

`;

});

chat.innerHTML=html;

chat.scrollTop=chat.scrollHeight;

}catch(err){

console.log(err);

}

}

async function sendMessage(){

if(chatLocked) return;

await loadChatStudent();

if(!chatStudentPhone){
alert("Unable to identify this student. Please try again.");
return;
}

const input=document.getElementById("message");

const message=input.value.trim();

if(!message) return;

try{

const res=await fetch(API+"/chat/send",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

requestId,
businessId,
studentPhone:chatStudentPhone,
senderType:"business",
message

})

});

const data=await res.json();

if(data.chatLocked){

lockChat();

return;

}

if(!res.ok || data.error){

alert(data.error || "Unable to send message.");

return;

}

input.value="";

loadMessages();

}catch(err){

console.log(err);

alert("Unable to send message. Please try again.");

}

}

</script>

</body>

</html>
