<!DOCTYPE html>
<html>
<head>
  <title>Service Connect Admin</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:15px;
      background:#020617;
      color:white;
      font-family:Arial,sans-serif;
    }

    h1{
      text-align:center;
      color:#22c55e;
      margin-bottom:20px;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen{
      max-width:420px;
      margin:70px auto;
      background:#0f172a;
      padding:25px;
      border-radius:18px;
      box-shadow:0 0 20px rgba(0,0,0,.5);
    }

    #loginScreen h1{
      margin-bottom:10px;
    }

    .loginSubtitle{
      text-align:center;
      color:#94a3b8;
      margin-bottom:25px;
    }

    .loginInput{
      width:100%;
      padding:14px;
      margin-bottom:15px;
      border:none;
      border-radius:10px;
      font-size:16px;
      outline:none;
    }

    .loginBtn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#22c55e;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .loginBtn:disabled{
      opacity:.6;
    }

    #loginError{
      color:#ef4444;
      text-align:center;
      margin-top:15px;
      display:none;
    }

    /* =========================
       ADMIN PANEL
    ========================= */

    #adminPanel{
      display:none;
    }

    .topBar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:20px;
    }

    .topBtn{
      flex:1;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#22c55e;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    .logoutBtn{
      padding:14px 18px;
      border:none;
      border-radius:12px;
      background:#ef4444;
      color:white;
      font-size:15px;
      cursor:pointer;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:15px;
      margin-bottom:20px;
    }

    .statCard{
      background:#0f172a;
      padding:18px;
      border-radius:15px;
      text-align:center;
      box-shadow:0 0 10px rgba(0,0,0,.4);
    }

    .statCard h2{
      margin:0;
      font-size:30px;
      color:#22c55e;
    }

    .statCard p{
      margin-top:8px;
      color:#94a3b8;
      font-size:15px;
    }

    #searchBox{
      width:100%;
      padding:14px;
      margin-bottom:20px;
      border:none;
      border-radius:12px;
      font-size:16px;
      outline:none;
    }

    .card{
      background:#0f172a;
      padding:15px;
      border-radius:15px;
      margin-bottom:20px;
      box-shadow:0 0 10px rgba(0,0,0,.4);
    }

    .card h2{
      margin-top:0;
      color:#22c55e;
    }

    .active{
      color:#22c55e;
      font-weight:bold;
    }

    .inactive{
      color:#ef4444;
      font-weight:bold;
    }

    button{
      width:100%;
      padding:13px;
      border:none;
      border-radius:10px;
      margin-top:10px;
      color:white;
      font-size:15px;
      cursor:pointer;
    }

    .approveBtn{
      background:#22c55e;
    }

    .disapproveBtn{
      background:#f59e0b;
    }

    .callBtn{
      background:#3b82f6;
    }

    .whatsappBtn{
      background:#10b981;
    }

    .countdown{
      margin-top:10px;
      color:#facc15;
      font-weight:bold;
    }

    .loading{
      text-align:center;
      padding:30px;
      color:#94a3b8;
    }

  </style>
</head>

<body>


<!-- ==================================================
     LOGIN SCREEN
================================================== -->

<div id="loginScreen">

  <h1>⚡ ADMIN LOGIN</h1>

  <div class="loginSubtitle">
    Service Connect Control Center
  </div>

  <input
    id="username"
    class="loginInput"
    type="text"
    placeholder="Admin Username"
    autocomplete="username"
  >

  <input
    id="password"
    class="loginInput"
    type="password"
    placeholder="Admin Password"
    autocomplete="current-password"
  >

  <button
    id="loginButton"
    class="loginBtn"
    onclick="adminLogin()"
  >
    Login
  </button>

  <div id="loginError"></div>

</div>


<!-- ==================================================
     ADMIN PANEL
================================================== -->

<div id="adminPanel">

  <h1>⚡ ADMIN CONTROL CENTER</h1>

  <div class="topBar">

    <button
      class="topBtn"
      onclick="loadBusinesses()"
    >
      Load Businesses
    </button>

    <button
      class="logoutBtn"
      onclick="logout()"
    >
      Logout
    </button>

  </div>


  <!-- =========================
       STATISTICS
  ========================= -->

  <div class="stats">

    <div class="statCard">

      <h2 id="totalBusiness">0</h2>

      <p>Total Businesses</p>

    </div>


    <div class="statCard">

      <h2 id="activeBusiness">0</h2>

      <p>Active</p>

    </div>


    <div class="statCard">

      <h2 id="inactiveBusiness">0</h2>

      <p>Inactive</p>

    </div>


    <div class="statCard">

      <h2 id="expiredBusiness">0</h2>

      <p>Expired</p>

    </div>

  </div>


  <!-- =========================
       SEARCH
  ========================= -->

  <input
    id="searchBox"
    type="text"
    placeholder="🔍 Search by Business Name, Code, Phone or Location..."
    oninput="filterBusinesses()"
  >


  <!-- =========================
       BUSINESS LIST
  ========================= -->

  <div id="list"></div>

</div>


<script>

const API =
  "https://service-backend-jezm.onrender.com";


let allBusinesses = [];


/* ==================================================
   LOGIN
================================================== */

async function adminLogin(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const loginButton =
    document.getElementById("loginButton");

  const loginError =
    document.getElementById("loginError");


  loginError.style.display = "none";


  if(!username || !password){

    loginError.innerText =
      "Please enter your username and password.";

    loginError.style.display = "block";

    return;

  }


  loginButton.disabled = true;

  loginButton.innerText = "Logging in...";


  try{

    const res =
      await fetch(
        API + "/admin/login",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            username,
            password
          })
        }
      );


    const data =
      await res.json();


    if(!res.ok){

      throw new Error(
        data.message ||
        data.error ||
        "Login failed"
      );

    }


    /*
      Store only for this browser session.
      Closing the browser/tab removes it.
    */

    sessionStorage.setItem(
      "serviceConnectAdminToken",
      data.token
    );


    document.getElementById(
      "loginScreen"
    ).style.display = "none";


    document.getElementById(
      "adminPanel"
    ).style.display = "block";


    document.getElementById(
      "password"
    ).value = "";


    await loadBusinesses();


  }catch(err){

    console.log(err);


    loginError.innerText =
      err.message ||
      "Invalid admin username or password.";

    loginError.style.display = "block";


  }finally{

    loginButton.disabled = false;

    loginButton.innerText = "Login";

  }

}


/* ==================================================
   GET ADMIN TOKEN
================================================== */

function getAdminToken(){

  return sessionStorage.getItem(
    "serviceConnectAdminToken"
  );

}


/* ==================================================
   AUTHORIZED REQUEST
================================================== */

async function adminFetch(
  url,
  options = {}
){

  const token =
    getAdminToken();


  if(!token){

    logout();

    throw new Error(
      "Admin login required"
    );

  }


  const headers =
    options.headers || {};


  headers["Authorization"] =
    "Bearer " + token;


  options.headers =
    headers;


  const res =
    await fetch(
      url,
      options
    );


  /*
    If the backend says the token is
    invalid or expired, log the admin out.
  */

  if(
    res.status === 401
  ){

    logout();

    throw new Error(
      "Your admin session has expired. Please login again."
    );

  }


  return res;

}


/* ==================================================
   LOAD BUSINESSES
================================================== */

async function loadBusinesses(){

  document.getElementById(
    "list"
  ).innerHTML =
    '<div class="loading">Loading businesses...</div>';


  try{

    /*
      Check expiry first.
    */

    await adminFetch(
      API + "/business/check-expiry"
    );


    /*
      Then load businesses.
    */

    const res =
      await adminFetch(
        API + "/admin/businesses"
      );


    const data =
      await res.json();


    if(!res.ok){

      throw new Error(
        data.message ||
        data.error ||
        "Failed to load businesses"
      );

    }


    allBusinesses =
      Array.isArray(data)
      ? data
      : [];


    updateStatistics(
      allBusinesses
    );


    renderBusinesses(
      allBusinesses
    );


  }catch(err){

    console.log(err);


    document.getElementById(
      "list"
    ).innerHTML =
      '<div class="loading">' +
      'Failed to load businesses' +
      '</div>';

  }

}


/* ==================================================
   STATISTICS
================================================== */

function updateStatistics(
  data
){

  let total =
    data.length;

  let active =
    0;

  let inactive =
    0;

  let expired =
    0;


  data.forEach(
    b => {

      if(b.verified){

        active++;

      }else{

        inactive++;

      }


      if(
        b.expiryDate &&
        new Date(b.expiryDate) <= new Date()
      ){

        expired++;

      }

    }
  );


  document.getElementById(
    "totalBusiness"
  ).innerText =
    total;


  document.getElementById(
    "activeBusiness"
  ).innerText =
    active;


  document.getElementById(
    "inactiveBusiness"
  ).innerText =
    inactive;


  document.getElementById(
    "expiredBusiness"
  ).innerText =
    expired;

}


/* ==================================================
   RENDER BUSINESSES
================================================== */

function renderBusinesses(
  data
){

  let output = "";


  if(
    !data ||
    data.length === 0
  ){

    document.getElementById(
      "list"
    ).innerHTML =
      "<h3>No businesses found</h3>";

    return;

  }


  data.forEach(
    b => {

      let countdownText =
        "Not active";


      /*
        Use the backend's expiryDate.
        This avoids the old negative countdown
        problem caused by calculating from approvedAt.
      */

      if(
        b.verified &&
        b.expiryDate
      ){

        const expiryDate =
          new Date(
            b.expiryDate
          );

        const now =
          new Date();

        const diff =
          expiryDate - now;


        if(diff > 0){

          const days =
            Math.ceil(
              diff /
              (1000 * 60 * 60 * 24)
            );

          countdownText =
            days +
            " day(s) remaining";

        }else{

          countdownText =
            "Expired";

        }

      }


      output += `

        <div class="card">

          <h2>
            ${escapeHTML(
              b.name || "Unnamed Business"
            )}
          </h2>


          <p>
            <b>Business Code:</b>
            ${escapeHTML(
              b.businessCode || ""
            )}
          </p>


          <p>
            <b>Service:</b>
            ${escapeHTML(
              b.service || ""
            )}
          </p>


          <p>
            <b>Location:</b>
            ${escapeHTML(
              b.location || ""
            )}
          </p>


          <p>
            <b>Phone:</b>
            ${escapeHTML(
              b.phone || ""
            )}
          </p>


          <p>
            <b>Rating:</b>
            ${b.rating || 0}
          </p>


          <p>

            <b>Status:</b>

            ${
              b.verified

              ?

              '<span class="active">' +
              'ACTIVE' +
              '</span>'

              :

              '<span class="inactive">' +
              'INACTIVE' +
              '</span>'
            }

          </p>


          <div class="countdown">

            ${countdownText}

          </div>


          <button
            class="approveBtn"
            onclick="approveBusiness('${b._id}')"
          >
            Activate Business
          </button>


          <button
            class="disapproveBtn"
            onclick="disapproveBusiness('${b._id}')"
          >
            Deactivate Business
          </button>


          <button
            class="callBtn"
            onclick="callBusiness('${escapeAttribute(
              b.phone || ""
            )}')"
          >
            Call Business
          </button>


          <button
            class="whatsappBtn"
            onclick="whatsappBusiness('${escapeAttribute(
              b.phone || ""
            )}')"
          >
            WhatsApp Business
          </button>


        </div>

      `;

    }
  );


  document.getElementById(
    "list"
  ).innerHTML =
    output;

}


/* ==================================================
   ACTIVATE BUSINESS
================================================== */

async function approveBusiness(
  id
){

  try{

    const res =
      await adminFetch(
        API + "/admin/approve",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            id
          })
        }
      );


    const data =
      await res.json();


    alert(
      data.message ||
      data.error ||
      "Activation completed"
    );


    await loadBusinesses();


  }catch(err){

    console.log(err);


    alert(
      err.message ||
      "Activation failed"
    );

  }

}


/* ==================================================
   DEACTIVATE BUSINESS
================================================== */

async function disapproveBusiness(
  id
){

  try{

    const res =
      await adminFetch(
        API + "/admin/unapprove",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            id
          })
        }
      );


    const data =
      await res.json();


    alert(
      data.message ||
      data.error ||
      "Deactivation completed"
    );


    await loadBusinesses();


  }catch(err){

    console.log(err);


    alert(
      err.message ||
      "Deactivation failed"
    );

  }

}


/* ==================================================
   CALL
================================================== */

function callBusiness(
  phone
){

  if(!phone){

    return;

  }


  window.location.href =
    "tel:" + phone;

}


/* ==================================================
   WHATSAPP
================================================== */

function whatsappBusiness(
  phone
){

  if(!phone){

    return;

  }


  let cleaned =
    phone.startsWith("0")
    ?
    "234" +
    phone.substring(1)
    :
    phone;


  window.open(
    "https://wa.me/" +
    cleaned,
    "_blank"
  );

}


/* ==================================================
   SEARCH
================================================== */

function filterBusinesses(){

  const keyword =
    document.getElementById(
      "searchBox"
    ).value
    .toLowerCase();


  const filtered =
    allBusinesses.filter(
      b =>

      (b.name || "")
      .toLowerCase()
      .includes(keyword)

      ||

      (b.businessCode || "")
      .toLowerCase()
      .includes(keyword)

      ||

      (b.phone || "")
      .toLowerCase()
      .includes(keyword)

      ||

      (b.location || "")
      .toLowerCase()
      .includes(keyword)

    );


  renderBusinesses(
    filtered
  );

}


/* ==================================================
   LOGOUT
================================================== */

function logout(){

  sessionStorage.removeItem(
    "serviceConnectAdminToken"
  );


  document.getElementById(
    "adminPanel"
  ).style.display =
    "none";


  document.getElementById(
    "loginScreen"
  ).style.display =
    "block";


  document.getElementById(
    "username"
  ).value = "";


  document.getElementById(
    "password"
  ).value = "";


  document.getElementById(
    "loginError"
  ).style.display =
    "none";


  allBusinesses = [];

}


/* ==================================================
   BASIC HTML SAFETY
================================================== */

function escapeHTML(
  value
){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(
  value
){

  return String(value)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");

}


/* ==================================================
   START
================================================== */

const existingToken =
  getAdminToken();


if(existingToken){

  document.getElementById(
    "loginScreen"
  ).style.display =
    "none";


  document.getElementById(
    "adminPanel"
  ).style.display =
    "block";


  loadBusinesses();

}

</script>

</body>
</html>
