<!DOCTYPE html>
<html>
<head>
  <title>Admin Control Center</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body{
      margin:0;
      padding:20px;
      background:#020617;
      font-family:Arial;
      color:white;
    }

    h1{
      text-align:center;
      color:#22c55e;
    }

    button{
      border:none;
      border-radius:10px;
      padding:12px;
      cursor:pointer;
      font-size:15px;
      margin-top:8px;
    }

    .loadBtn{
      width:100%;
      background:#22c55e;
      color:white;
      margin-bottom:20px;
    }

    .card{
      background:#0f172a;
      padding:15px;
      border-radius:15px;
      margin-bottom:20px;
      box-shadow:0 0 10px rgba(0,0,0,0.3);
    }

    .verified{
      color:#22c55e;
      font-weight:bold;
    }

    .unverified{
      color:#ef4444;
      font-weight:bold;
    }

    .approveBtn{
      background:#22c55e;
      color:white;
      width:100%;
    }

    .unapproveBtn{
      background:#f59e0b;
      color:white;
      width:100%;
    }

    .deleteBtn{
      background:#ef4444;
      color:white;
      width:100%;
    }

    .callBtn{
      background:#3b82f6;
      color:white;
      width:100%;
    }

    .whatsappBtn{
      background:#10b981;
      color:white;
      width:100%;
    }

  </style>
</head>

<body>

<h1>⚡ ADMIN CONTROL CENTER</h1>

<button class="loadBtn" onclick="loadBusinesses()">
Load Businesses
</button>

<div id="list"></div>

<script>

async function loadBusinesses(){

  document.getElementById("list").innerHTML =
  "Loading businesses...";

  try{

    let res = await fetch(
      "https://service-backend-jezm.onrender.com/admin/businesses"
    );

    let data = await res.json();

    let output = "";

    if(data.length === 0){

      output = "<h3>No businesses yet</h3>";

    }

    data.forEach(b => {

      output += `

      <div class="card">

        <h2>${b.name}</h2>

        <p>
        <b>Service:</b>
        ${b.service}
        </p>

        <p>
        <b>Location:</b>
        ${b.location}
        </p>

        <p>
        <b>Phone:</b>
        ${b.phone}
        </p>

        <p>
        <b>Rating:</b>
        ${b.rating || 0}
        </p>

        <p>
        <b>Status:</b>

        ${
          b.verified
          ?
          '<span class="verified">ACTIVE</span>'
          :
          '<span class="unverified">INACTIVE</span>'
        }

        </p>

        <button
        class="approveBtn"
        onclick="approveBusiness('${b._id}')">
        Activate
        </button>

        <button
        class="unapproveBtn"
        onclick="deactivateBusiness('${b._id}')">
        Deactivate
        </button>

        <button
        class="callBtn"
        onclick="callBusiness('${b.phone}')">
        Call Business
        </button>

        <button
        class="whatsappBtn"
        onclick="whatsappBusiness('${b.phone}')">
        WhatsApp Business
        </button>

      </div>

      `;

    });

    document.getElementById("list").innerHTML =
    output;

  }catch(err){

    console.log(err);

    document.getElementById("list").innerHTML =
    "Failed to load businesses";

  }

}

async function approveBusiness(id){

  try{

    let res = await fetch(
      "https://service-backend-jezm.onrender.com/admin/approve",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          id
        })
      }
    );

    let data = await res.json();

    alert(data.message || data.error);

    loadBusinesses();

  }catch(err){

    console.log(err);

    alert("Activation failed");

  }

}

async function deactivateBusiness(id){

  try{

    let res = await fetch(
      "https://service-backend-jezm.onrender.com/admin/unapprove",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          id
        })
      }
    );

    let data = await res.json();

    alert(data.message || data.error);

    loadBusinesses();

  }catch(err){

    console.log(err);

    alert("Deactivation failed");

  }

}

function callBusiness(phone){

  window.location.href =
  "tel:" + phone;

}

function whatsappBusiness(phone){

  let link =
  "https://wa.me/234" +
  phone.substring(1);

  window.open(link, "_blank");

}

</script>

</body>
</html>
