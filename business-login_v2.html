<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Business Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:#020617;

color:white;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;

}

.card{

width:100%;

max-width:420px;

background:#0f172a;

padding:25px;

border-radius:22px;

box-shadow:0 15px 35px rgba(0,0,0,.35);

}

.logo{

font-size:55px;

text-align:center;

}

h2{

text-align:center;

margin-top:10px;

color:#22c55e;

}

p{

text-align:center;

margin-top:8px;

color:#94a3b8;

line-height:1.6;

}

input{

width:100%;

padding:16px;

margin-top:20px;

border:none;

outline:none;

border-radius:12px;

font-size:16px;

}

button{

width:100%;

padding:16px;

margin-top:20px;

border:none;

border-radius:12px;

background:#22c55e;

color:white;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.02);

}

#loading{

display:none;

text-align:center;

margin-top:15px;

color:#22c55e;

font-weight:bold;

}

.info{

margin-top:18px;

background:#111827;

padding:15px;

border-radius:12px;

font-size:14px;

color:#cbd5e1;

line-height:1.7;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">

🔑

</div>

<h2>

Business Login

</h2>

<p>

Login using your Service Connect Business Code.

</p>

<input

id="code"

placeholder="Example: SC-FUTO-ELEC-483921">

<button

onclick="loginBusiness()">

Login

</button>

<div id="loading">

Checking your account...

</div>

<div class="info">

Your Business Code was given to you after registration. Keep it safe because you'll use it whenever you want to access your business dashboard.

</div>

<script>

const API="https://service-backend-jezm.onrender.com";
async function loginBusiness(){

const code=
document.getElementById("code").value.trim().toUpperCase();

if(!code){

alert("Enter your Business Code.");

return;

}

document.getElementById("loading").style.display="block";

try{

const res=await fetch(API+"/business/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

businessCode:code

})

});

const data=await res.json();

document.getElementById("loading").style.display="none";

if(data.error){

alert(data.error);

return;

}

localStorage.setItem("businessId",data.business._id);

localStorage.setItem("businessCode",data.business.businessCode);

localStorage.setItem("businessName",data.business.name);

window.location.href="business-dashboard_v2.html";

}catch(err){

console.log(err);

document.getElementById("loading").style.display="none";

alert("Unable to connect to the server.");

}

}

</script>

</div>

</body>

</html>
