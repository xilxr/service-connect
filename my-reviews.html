<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>My Reviews</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
color:white;
padding:18px;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
color:#22c55e;
}

.summary{
background:#0f172a;
padding:20px;
border-radius:15px;
text-align:center;
margin-bottom:18px;
}

.summary h2{
font-size:45px;
color:#facc15;
}

.summary p{
margin-top:8px;
color:#cbd5e1;
}

.card{
background:#0f172a;
padding:15px;
border-radius:15px;
margin-top:15px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
background:#475569;
color:white;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<h1>⭐ My Reviews</h1>

</div>

<button onclick="location.href='business-dashboard_v2.html'">

⬅ Back To Dashboard

</button>

<div id="reviewSummary"
class="summary">

Loading...

</div>

<div id="reviewsContainer">

Loading Reviews...

</div>

<script>

const API =
"https://service-backend-jezm.onrender.com";

const businessId =
localStorage.getItem("businessId");

loadReviews();

async function loadReviews(){

const summary =
document.getElementById("reviewSummary");

const container =
document.getElementById("reviewsContainer");

try{

const res =
await fetch(

API+"/business/"+businessId+"/reviews"

);

const data =
await res.json();

await fetch(

API + "/business/" + businessId + "/reviews/viewed",

{

method:"POST"

}

);

if(!data.reviews || data.reviews.length===0){

summary.innerHTML=`

<h2>0.0</h2>

<p>No reviews yet</p>

`;

container.innerHTML="";

return;

}

let total=0;

let html="";

data.reviews.forEach(r=>{

total+=Number(r.rating);

html+=`

<div class="card">

<h3>

👤 ${r.studentName || "Anonymous"}

</h3>

<p style="margin-top:10px;">

⭐ ${r.rating}/5

</p>

<p style="margin-top:10px;">

${r.comment}

</p>

<p style="margin-top:12px;
color:#94a3b8;">

${new Date(r.createdAt).toLocaleDateString()}

</p>

</div>

`;

});

const average =
(total/data.reviews.length).toFixed(1);

summary.innerHTML=`

<h2>

⭐ ${average}

</h2>

<p>

Average Rating

</p>

<p>

${data.reviews.length}
Total Reviews

</p>

`;

container.innerHTML=html;

}catch(err){

console.log(err);

summary.innerHTML="Unable to load.";

container.innerHTML="";

}

}

</script>

</body>

</html>
