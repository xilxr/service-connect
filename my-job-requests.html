<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>My Job Requests</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
color:white;
padding:18px;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
color:#22c55e;
}

.card{
background:#0f172a;
padding:15px;
border-radius:15px;
margin-top:15px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#22c55e;
color:white;
font-size:15px;
cursor:pointer;
}

.backBtn{
background:#475569;
}

</style>

</head>

<body>

<div class="header">
<h1>📥 My Job Requests</h1>
</div>

<button class="backBtn"
onclick="window.location.href='business-dashboard_v2.html'">
⬅ Back To Dashboard
</button>

<div id="requestContainer">
Loading requests...
</div>

<script>

const API =
"https://service-backend-jezm.onrender.com";

/* =========================================
   BUSINESS LOGIN PROTECTION
========================================= */

const businessId =
  localStorage.getItem("businessId");

function getBusinessAuthToken() {

  return localStorage.getItem("businessToken") || "";

}

function hasValidBusinessSession() {

  const token = getBusinessAuthToken();

  return (

    typeof businessId === "string" &&

    /^[a-f0-9]{24}$/i.test(businessId) &&

    token.trim().length > 0

  );

}

/* =========================================
   PROTECTED JOB REQUEST LOADING
========================================= */

let jobRequestsLoading = false;

async function loadJobRequests(){

  const container =
    document.getElementById("requestContainer");

  if (!container) return;

  if (!hasValidBusinessSession()) {

    window.location.replace(
      "business-login_v2.html"
    );

    return;

  }

  /* Prevent overlapping requests */

  if (jobRequestsLoading) return;

  jobRequestsLoading = true;

  try{

/* =========================================
   AUTHENTICATED JOB REQUESTS
========================================= */

const token = getBusinessAuthToken();

if (!hasValidBusinessSession()) {

  window.location.replace(
    "business-login_v2.html"
  );

  return;

}

const res = await fetch(

  API + "/business/" +
  encodeURIComponent(businessId) +
  "/requests",

  {

    method: "GET",

    headers: {

      "Authorization": "Bearer " + token

    }

  }

);

/* Prevent outdated session responses */

if (

  getBusinessAuthToken() !== token ||

  localStorage.getItem("businessId") !== businessId

) {

  return;

}

/* Handle expired or invalid sessions */

if (res.status === 401) {

  window.location.replace(
    "business-login_v2.html"
  );

  return;

}

/* Prevent unauthorized access */

if (res.status === 403) {

  container.textContent =
    "You are not authorized to access these requests.";

  return;

}

/* Validate server response */

if (!res.ok) {

  throw new Error(
    "Unable to load job requests."
  );

}

const data = await res.json();

if (

  getBusinessAuthToken() !== token ||

  localStorage.getItem("businessId") !== businessId

) {

  return;

}

/* Validate response format */

if (!Array.isArray(data)) {

  throw new Error(
    "Invalid job requests response."
  );

}

if (data.length === 0) {

  container.textContent =
    "No requests yet.";

  return;

}

/* =========================================
   SECURE JOB REQUEST CARD RENDERING
========================================= */

const fragment = document.createDocumentFragment();

data.forEach(r => {

  if (

    !r ||

    typeof r._id !== "string" ||

    !/^[a-f0-9]{24}$/i.test(r._id)

  ) return;

  const requestId = r._id;

  const studentName =

    typeof r.studentName === "string" &&
    r.studentName.trim()

      ? r.studentName

      : "Customer";

  const allowedStatuses = [

    "Pending",
    "Accepted",
    "Completed",
    "Declined"

  ];

  const status = allowedStatuses.includes(r.status)

    ? r.status

    : "Unknown";

  const card = document.createElement("div");

  card.className = "card";

  /* Safely display customer information */

  function addInformation(label, value, fallback, bold) {

    const safeValue =

      typeof value === "string" && value.trim()

        ? value

        : fallback;

    const element = document.createElement("div");

    element.style.marginBottom = "16px";

    element.textContent = label + safeValue;

    if (bold) {

      element.style.fontWeight = "bold";

    }

    card.appendChild(element);

  }

  addInformation(
    "👤 ",
    studentName,
    "Customer",
    true
  );

  addInformation(
    "📞 ",
    r.studentPhone,
    "No Phone",
    false
  );

  addInformation(
    "🛠 ",
    r.service,
    "Service",
    false
  );

  addInformation(
    "📍 ",
    r.location,
    "Unknown",
    false
  );

  addInformation(
    "📌 Status: ",
    status,
    "Unknown",
    true
  );

  /* Validate request date */

  const requestDate = new Date(r.createdAt);

  const dateText =

    r.createdAt &&
    Number.isFinite(requestDate.getTime())

      ? requestDate.toLocaleString()

      : "Date unavailable";

  addInformation(
    "🗓 ",
    dateText,
    "Date unavailable",
    false
  );

  /* Safely create action buttons */

  function addButton(label, color, action, disabled = false) {

    const button = document.createElement("button");

    button.type = "button";

    button.textContent = label;

    button.style.background = color;

    button.disabled = disabled;

    if (disabled) {

      button.style.cursor = "default";

    }

    if (typeof action === "function" && !disabled) {

      button.addEventListener("click", action);

    }

    card.appendChild(button);

  }

  /* Pending requests */

  if (status === "Pending") {

    addButton(

      "✅ Accept",

      "#16a34a",

      () => updateRequestStatus(
        requestId,
        "Accepted"
      )

    );

    addButton(

      "❌ Decline",

      "#ef4444",

      () => updateRequestStatus(
        requestId,
        "Declined"
      )

    );

  }

  /* Accepted requests */

  else if (status === "Accepted") {

    addButton(

      "🟢 Accepted",

      "#22c55e",

      null,

      true

    );

    addButton(

      "💬 Open Chat",

      "#2563eb",

      () => openBusinessChat(
        requestId,
        studentName
      )

    );

    addButton(

      "🏆 Complete Job",

      "#f59e0b",

      () => completeJob(requestId)

    );

  }

  /* Completed requests */

  else if (status === "Completed") {

    addButton(

      "✅ Job Completed",

      "#22c55e",

      null,

      true

    );

  }

  /* Declined requests */

  else if (status === "Declined") {

    addButton(

      "❌ Declined",

      "#ef4444",

      null,

      true

    );

  }

  fragment.appendChild(card);

});

/* Handle empty or invalid request records */

if (!fragment.hasChildNodes()) {

  container.textContent = "No valid requests found.";

  return;

}

/* Safely display all request cards */

container.replaceChildren(fragment);

  } catch (err) {

    console.error(
      "LOAD JOB REQUESTS ERROR:",
      err
    );

    if (!container.querySelector(".card")) {

      container.textContent =
        "Failed to load requests. Please check your connection.";

    }

  } finally {

    jobRequestsLoading = false;

  }

}

/* =========================================
   SECURE ACCEPT AND DECLINE REQUESTS
========================================= */

let requestStatusUpdating = false;

async function updateRequestStatus(requestId, status) {

  const token = getBusinessAuthToken();

  if (!hasValidBusinessSession()) {

    window.location.replace(
      "business-login_v2.html"
    );

    return;

  }

  /* Validate request ID */

  if (

    typeof requestId !== "string" ||

    !/^[a-f0-9]{24}$/i.test(requestId)

  ) {

    alert("Invalid job request.");

    return;

  }

  /* Allow only valid status changes */

  if (!["Accepted", "Declined"].includes(status)) {

    alert("Invalid request status.");

    return;

  }

  /* Prevent duplicate submissions */

  if (requestStatusUpdating) return;

  requestStatusUpdating = true;

  try {

    const res = await fetch(

      API + "/request/status",

      {

        method: "POST",

        headers: {

          "Content-Type": "application/json",

          "Authorization": "Bearer " + token

        },

        body: JSON.stringify({

          requestId,

          status

        })

      }

    );

    /* Verify current session */

    if (

      getBusinessAuthToken() !== token ||

      localStorage.getItem("businessId") !== businessId

    ) {

      return;

    }

    if (res.status === 401) {

      alert(
        "Your session has expired. Please log in again."
      );

      window.location.replace(
        "business-login_v2.html"
      );

      return;

    }

    if (res.status === 403) {

      alert(
        "You are not authorized to update this request."
      );

      return;

    }

    const data = await res.json();

    if (

      getBusinessAuthToken() !== token ||

      localStorage.getItem("businessId") !== businessId

    ) {

      return;

    }

    /* Validate server response */

    if (

      !res.ok ||

      !data ||

      data.error ||

      typeof data.message !== "string"

    ) {

      alert(

        typeof data?.error === "string"

          ? data.error

          : "Unable to update this request."

      );

      return;

    }

    alert(data.message);

    loadJobRequests();

  } catch (error) {

    console.error(
      "REQUEST STATUS UPDATE ERROR:",
      error
    );

    alert(
      "Unable to confirm the request update. Please check your connection."
    );

  } finally {

    requestStatusUpdating = false;

  }

}

/* =========================================
   SECURE JOB COMPLETION
========================================= */

let jobCompletionSubmitting = false;

async function completeJob(requestId) {

  const token = getBusinessAuthToken();

  if (!hasValidBusinessSession()) {

    window.location.replace(
      "business-login_v2.html"
    );

    return;

  }

  /* Validate request ID */

  if (

    typeof requestId !== "string" ||

    !/^[a-f0-9]{24}$/i.test(requestId)

  ) {

    alert("Invalid job request.");

    return;

  }

  /* Prevent duplicate submissions */

  if (

    jobCompletionSubmitting ||

    requestStatusUpdating

  ) return;

  /* Confirm job completion */

  const confirmed = confirm(

    "Are you sure you have completed this job?"

  );

  if (!confirmed) return;

  jobCompletionSubmitting = true;

  try {

    const res = await fetch(

      API + "/request/complete",

      {

        method: "POST",

        headers: {

          "Content-Type": "application/json",

          "Authorization": "Bearer " + token

        },

        body: JSON.stringify({

          requestId

        })

      }

    );

    /* Verify current session */

    if (

      getBusinessAuthToken() !== token ||

      localStorage.getItem("businessId") !== businessId

    ) {

      return;

    }

    /* Handle expired session */

    if (res.status === 401) {

      alert(

        "Your session has expired. Please log in again."

      );

      window.location.replace(
        "business-login_v2.html"
      );

      return;

    }

    /* Handle unauthorized access */

    if (res.status === 403) {

      alert(

        "You are not authorized to complete this job."

      );

      return;

    }

    const data = await res.json();

    if (

      getBusinessAuthToken() !== token ||

      localStorage.getItem("businessId") !== businessId

    ) {

      return;

    }

    /* Validate server response */

    if (

      !res.ok ||

      !data ||

      data.error ||

      typeof data.message !== "string"

    ) {

      alert(

        typeof data?.error === "string"

          ? data.error

          : "Unable to complete this job."

      );

      return;

    }

    alert(data.message);

    loadJobRequests();

  } catch (error) {

    console.error(

      "JOB COMPLETION ERROR:",

      error

    );

    alert(

      "Unable to confirm job completion. Please check your connection."

    );

  } finally {

    jobCompletionSubmitting = false;

  }

}

/* =========================================
   SECURE BUSINESS CHAT NAVIGATION
========================================= */

function openBusinessChat(requestId, studentName) {

  if (!hasValidBusinessSession()) {

    window.location.replace(
      "business-login_v2.html"
    );

    return;

  }

  if (

    typeof requestId !== "string" ||

    !/^[a-f0-9]{24}$/i.test(requestId)

  ) {

    alert("Invalid chat request.");

    return;

  }

  const safeCustomerName =

    typeof studentName === "string" &&
    studentName.trim()

      ? studentName

      : "Customer";

  localStorage.setItem(
    "chatRequestId",
    requestId
  );

  localStorage.setItem(
    "chatCustomerName",
    safeCustomerName
  );

  window.location.href =

    "business-chat.html?requestId=" +

    encodeURIComponent(requestId);

}

/* =========================================
   INITIALIZE JOB REQUESTS PAGE
========================================= */

if (!hasValidBusinessSession()) {

  window.location.replace(
    "business-login_v2.html"
  );

} else {

  loadJobRequests();

}

/* =========================================
   PROTECTED AUTOMATIC REFRESH
========================================= */

setInterval(() => {

  if (!hasValidBusinessSession()) {

    window.location.replace(
      "business-login_v2.html"
    );

    return;

  }

  /* Pause background refresh when hidden */

  if (document.hidden) return;

  /* Prevent refresh during active operations */

  if (

    jobRequestsLoading ||

    requestStatusUpdating ||

    jobCompletionSubmitting

  ) return;

  loadJobRequests();

}, 5000);

</script>

</body>
</html>
