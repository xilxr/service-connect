<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Student Chat</title>

<style>

body{

margin:0;
font-family:Arial,sans-serif;
background:#0b141a;
color:white;

}

.header{

background:#075e54;
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold;

}

#messages{

height:65vh;
overflow-y:auto;
padding:15px;

}

.message{

padding:12px;
border-radius:12px;
margin:10px 0;
max-width:80%;

}

.student{
background:#005c4b;
margin-left:auto;
color:white;
}

.business{
background:#202c33;
margin-right:auto;
color:white;
}

.dateSeparator{
display:table;
margin:20px auto 12px;
padding:7px 14px;
background:#182b34;
color:#d1d7db;
font-size:12px;
font-weight:bold;
border-radius:10px;
text-align:center;
box-shadow:0 1px 3px rgba(0,0,0,.2);
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
align-items:center;
gap:8px;
padding:10px;
padding-bottom:max(10px, env(safe-area-inset-bottom));
background:#202c33;
}

input{
flex:1;
min-width:0;
padding:12px 15px;
border:none;
border-radius:25px;
outline:none;
background:#2a3942;
color:white;
font-size:15px;
}

button{
margin-left:0;
padding:12px 18px;
background:#00a884;
border:none;
color:white;
border-radius:25px;
font-weight:bold;
cursor:pointer;
}

.back{

background:#475569;
margin:10px;

}

</style>

</head>

<body>

<button class="back"
onclick="history.back()">

⬅ Back

</button>

<div class="header">

💬 SERVICE CONNECT

</div>

<div id="messages">

Loading...

</div>

<div class="bottom">

<input
id="message"
placeholder="Type message...">

<button
onclick="sendMessage()">

Send

</button>

</div>

<script>

const API =
"https://service-backend-jezm.onrender.com";

const requestId =
localStorage.getItem("chatRequestId");

const studentPhone =
localStorage.getItem("studentPhone");

const businessId =
localStorage.getItem("chatBusinessId");

loadMessages();

setInterval(loadMessages,2000);

async function loadMessages(){

try{

const res =
await fetch(
API+"/chat/messages/"+requestId
);

const data =
await res.json();

await fetch(API+"/chat/read/"+requestId,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({readerType:"student"})
});

const box =
document.getElementById("messages");

let html="";
let lastDate="";

data.forEach(m=>{

const messageDate = new Date(m.createdAt);

const dateKey = [
messageDate.getFullYear(),
messageDate.getMonth(),
messageDate.getDate()
].join("-");

if(dateKey !== lastDate){

const today = new Date();

const yesterday = new Date(today);
yesterday.setDate(today.getDate()-1);

const sameDay = (a,b) =>
a.getFullYear() === b.getFullYear() &&
a.getMonth() === b.getMonth() &&
a.getDate() === b.getDate();

let dateLabel;

if(sameDay(messageDate,today)){
dateLabel="Today";
}else if(sameDay(messageDate,yesterday)){
dateLabel="Yesterday";
}else{
dateLabel=messageDate.toLocaleDateString("en-US",{
year:"numeric",
month:"long",
day:"numeric"
});
}

html += `<div class="dateSeparator">${dateLabel}</div>`;

lastDate=dateKey;

}

html += `
<div class="message ${
  m.senderType === "student" ? "student" : "business"
}">
  ${m.message}
  <div style="font-size:11px;opacity:.7;margin-top:5px;text-align:right">
    ${new Date(m.createdAt).toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    })}
    ${m.senderType === "student"
      ? (m.read ? '<span style="color:#53bdeb"> ✓✓</span>' : ' ✓')
      : ''}
  </div>
</div>`;

});

box.innerHTML=html;

box.scrollTop=
box.scrollHeight;

}catch(err){

console.log(err);

}

}

async function sendMessage(){

const message =
document.getElementById("message").value.trim();

if(message==="") return;

await fetch(

API+"/chat/send",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

requestId,

businessId,

studentPhone,

senderType:"student",

message

})

}

);

document.getElementById("message").value="";

loadMessages();

}

</script>

</body>

</html>
