<!DOCTYPE html>
<html>
<head>
  <title>Business Portal</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body{
      background:#020617;
      color:white;
      font-family:Arial;
      padding:20px;
      text-align:center;
    }

    input{
      width:90%;
      padding:14px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      outline:none;
    }

    button{
      width:95%;
      padding:14px;
      margin-top:12px;
      border:none;
      border-radius:10px;
      background:#22c55e;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    .card{
      background:#0f172a;
      padding:15px;
      border-radius:15px;
      margin-top:20px;
    }

    img{
      width:100%;
      border-radius:15px;
      margin-top:10px;
    }

    #remarkBox{
      color:#22c55e;
      font-weight:bold;
      margin-top:10px;
      word-break:break-word;
    }

  </style>
</head>

<body>

<h2>💼 Register Your Service</h2>

<div class="card">

<input id="name" placeholder="Your Name">

<input id="service" placeholder="Your Service">

<input id="location" placeholder="Your Location">

<input id="phone" placeholder="WhatsApp Number">

<button onclick="registerBusiness()">
Register
</button>

<p id="result"></p>

</div>

<div class="card">

<h3>💳 Pay ₦2000 To Activate</h3>

<img src="https://i.ibb.co/Pvz0zyVZ/1777417845030.png">

<p>
Use your generated ID as payment remark
</p>

<p id="remarkBox"></p>

<button onclick="copyRemark()">
Copy Remark
</button>

<button onclick="openWhatsApp()">
Send Proof On WhatsApp
</button>

<button onclick="iHavePaid()">
I Have Paid
</button>

</div>

<script>

let businessId = "";

async function registerBusiness(){

  let name =
    document.getElementById("name").value;

  let service =
    document.getElementById("service").value;

  let location =
    document.getElementById("location").value;

  let phone =
    document.getElementById("phone").value;

  if(!name || !service || !location || !phone){

    alert("Fill all fields");

    return;

  }

  try{

    let res = await fetch(
      "https://service-backend-jezm.onrender.com/business/signup",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          name,
          service,
          location,
          phone
        })
      }
    );

    let data = await res.json();

    if(data.error){

      alert(data.error);

      return;

    }

    businessId = data.business._id;

    document.getElementById("result").innerHTML = `
      Registration Successful ✔<br><br>
      Your Business ID:<br>
      <b>${businessId}</b>
    `;

    document.getElementById("remarkBox")
      .innerText = businessId;

  }catch(err){

    console.log(err);

    alert("Registration failed");

  }

}

function copyRemark(){

  let text =
    document.getElementById("remarkBox").innerText;

  navigator.clipboard.writeText(text);

  alert("Remark copied ✔");

}

function openWhatsApp(){

  let message =
`Hello Admin,
I have made payment.

Business ID:
${businessId}

Please verify my payment.`;

  let link =
"https://wa.me/2348107661212?text="
+
encodeURIComponent(message);

  window.open(link,"_blank");

}

async function iHavePaid(){

  if(!businessId){

    alert("Please register first");

    return;

  }

  try{

    let res = await fetch(
      "https://service-backend-jezm.onrender.com/business/pay",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          id:businessId
        })
      }
    );

    let data = await res.json();

    alert(data.message || data.error);

  }catch(err){

    console.log(err);

    alert("Payment update failed");

  }

}

</script>

</body>
</html>
