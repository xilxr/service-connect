<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Find a Worker - Service Connect</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
}

header{

background:linear-gradient(135deg,#16a34a,#22c55e);

padding:25px;

border-bottom-left-radius:25px;
border-bottom-right-radius:25px;

text-align:center;

box-shadow:0 10px 25px rgba(0,0,0,.35);

}

header h1{

font-size:30px;

}

header p{

margin-top:8px;

opacity:.95;

}

.container{

padding:20px;

}

.searchBox{

background:#0f172a;

padding:20px;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,.3);

}

input{

width:100%;

padding:15px;

border:none;

outline:none;

border-radius:12px;

margin-top:12px;

font-size:15px;

}

button{

width:100%;

padding:16px;

margin-top:15px;

border:none;

border-radius:12px;

background:#22c55e;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

}

button:hover{

transform:scale(1.02);

}

#loading{

display:none;

text-align:center;

margin-top:20px;

color:#22c55e;

font-weight:bold;

}

.workerCard{

background:#0f172a;

margin-top:20px;

padding:18px;

border-radius:18px;

box-shadow:0 8px 20px rgba(0,0,0,.3);

}

.topRow{

display:flex;

align-items:center;

gap:15px;

}

.profile{

width:75px;

height:75px;

border-radius:50%;

object-fit:cover;

border:3px solid #22c55e;

}

.name{

font-size:22px;

font-weight:bold;

}

.service{

color:#22c55e;

margin-top:5px;

}

.location{

margin-top:5px;

color:#cbd5e1;

}

.bio{

margin-top:15px;

line-height:1.7;

color:#cbd5e1;

}

.rating{

margin-top:12px;

font-weight:bold;

color:#facc15;

}

.badge{

display:inline-block;

margin-top:12px;

padding:8px 14px;

border-radius:20px;

background:#16a34a;

font-size:13px;

font-weight:bold;

}

.action{

display:flex;

gap:10px;

margin-top:18px;

}

.action button{

margin:0;

}

.call{

background:#2563eb;

}

.rate{

background:#f59e0b;

}

.stats{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:12px;

margin-bottom:20px;

}

.statCard{

background:#0f172a;

padding:18px;

border-radius:16px;

text-align:center;

box-shadow:0 0 12px rgba(0,0,0,.3);

}

.statCard h2{

color:#22c55e;

font-size:28px;

margin:0;

}

.statCard p{

margin-top:8px;

color:#94a3b8;

font-size:14px;

}

.empty{

text-align:center;

margin-top:30px;

color:#94a3b8;

font-size:16px;

}

</style>

</head>

<body>

<header>

<h1>🔍 Find a Worker</h1>

<p>Search verified professionals around you</p>

</header>

<div class="container">

<div class="searchBox" style="margin-bottom:20px;">

<h2 style="color:#22c55e;margin-bottom:15px;">🏆 Top Verified Workers</h2>

<div id="topWorkers">

Loading top workers...

</div>

</div>

<div class="stats">

<div class="statCard">

<h2 id="totalWorkers">0</h2>

<p>Workers</p>

</div>

<div class="statCard">

<h2 id="verifiedWorkers">0</h2>

<p>Verified</p>

</div>

<div class="statCard">

<h2 id="locations">0</h2>

<p>Locations</p>

</div>

</div>

<div class="searchBox">

<input
id="studentName"
placeholder="Your full name">

<input
id="studentPhone"
placeholder="Your phone number">

<input
id="service"
placeholder="What service do you need?">

<input
id="location"
placeholder="Enter your location (e.g. FUTO)">

<button onclick="findWorkers()">

Search Now

</button>

<div id="loading">

Searching nearby professionals...

</div>

</div>

<div id="results"></div>

</div>

<script>

const API =
"https://service-backend-jezm.onrender.com";

async function loadStats(){

try{

const res = await fetch(

API + "/admin/businesses"

);

const data = await res.json();

document.getElementById("totalWorkers").innerHTML =
data.length;

let verified = 0;

const locations = new Set();

data.forEach(b=>{

if(b.verified){

verified++;

}

if(b.location){

locations.add(
b.location.toLowerCase()
);

}

});

document.getElementById("verifiedWorkers").innerHTML =
verified;

document.getElementById("locations").innerHTML =
locations.size;

}catch(err){

console.log(err);

}

}

loadStats();

loadTopWorkers();

async function loadTopWorkers(){

try{

const res = await fetch(API + "/top-workers");

const workers = await res.json();

const container = document.getElementById("topWorkers");

if(!workers || workers.length===0){

container.innerHTML = "No verified workers yet.";

return;

}

let html = "";

workers.forEach(w => {

html +=  <div style="background:#1e293b;padding:12px;border-radius:12px;margin-top:10px;">  <b>${w.name}</b><br>  🛠 ${w.service}<br>  📍 ${w.location}<br>  ⭐ ${Number(w.rating || 0).toFixed(1)} (${w.reviews || 0} reviews)<br>  🛡 ${w.trustScore || 100}% Trust  </div> ;

});

container.innerHTML = html;

}catch(err){

console.log(err);

document.getElementById("topWorkers").innerHTML = "Unable to load top workers.";

}

}

async function findWorkers(){

const studentName =
document.getElementById("studentName").value.trim();

const studentPhone =
document.getElementById("studentPhone").value.trim();

const service =
document.getElementById("service").value.trim();

const location =
document.getElementById("location").value.trim();

if(!studentName || !studentPhone || !service || !location){

alert("Please fill in all fields.");

return;

}

document.getElementById("loading").style.display="block";

document.getElementById("results").innerHTML="";

try{

const res=await fetch(API+"/request",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

studentName,

studentPhone,

message:service,

location:location

})

});

const data=await res.json();

document.getElementById("loading").style.display="none";

if(!data.matches || data.matches.length===0){

document.getElementById("results").innerHTML=

'<div class="empty">No verified worker found in your area.</div>';

return;

}

let html="";

data.matches.forEach(worker=>{

const photo=

worker.profilePicture && worker.profilePicture!=""

?worker.profilePicture

:"https://cdn-icons-png.flaticon.com/512/149/149071.png";

const bio=

worker.shortBio && worker.shortBio!=""

?worker.shortBio

:"Trusted Service Connect Professional.";

const rating=

Number(worker.rating||0).toFixed(1);

const trustScore = Math.min(
100,
Math.round(
(Number(worker.rating || 0) * 20) +
(Number(worker.reviews || 0) * 2)
)
);

const trustColor =
trustScore >= 80
? "#16a34a"
: trustScore >= 50
? "#f59e0b"
: "#ef4444";

html+=`

<div class="workerCard">

<div class="topRow">

<img class="profile" src="${photo}">

<div>

<div class="name">${worker.name}</div>

<div class="service">${worker.service}</div>

<div class="location">📍 ${worker.location}</div>

</div>

</div>

<div class="bio">

${bio}

</div>

<div class="rating">

⭐ ${rating} (${worker.reviews} Reviews)

</div>

<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">

<div class="badge">
✅ VERIFIED
</div>

<div class="badge">
🟢 AVAILABLE
</div>

<div class="badge"
style="background:${trustColor};">
🛡️ Trust ${trustScore}%
</div>

</div>

<div class="action">

<button onclick="chat('${worker.phone}','${worker._id}')">

💬 WhatsApp

</button>

<button class="call"

onclick="callWorker('${worker.phone}','${worker._id}')">

📞 Call

</button>

<button class="rate"

onclick="rateBusiness('${worker._id}')">

⭐ Rate

</button>

</div>

</div>

`;

});

document.getElementById("results").innerHTML=html;

}catch(err){

console.log(err);

document.getElementById("loading").style.display="none";

document.getElementById("results").innerHTML=

'<div class="empty">Unable to connect to the server.</div>';

}

}

async function chat(phone,id){

try{

await fetch(API+"/business/whatsapp-click",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

id:id

})

});

}catch(err){

console.log(err);

}

let number=phone;

if(number.startsWith("0")){

number="234"+number.substring(1);

}

window.open(

"https://wa.me/"+number,

"_blank"

);

}

async function callWorker(phone,id){

try{

await fetch(API+"/business/call-click",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

id:id

})

});

}catch(err){

console.log(err);

}

window.location.href="tel:"+phone;

}

async function rateBusiness(id){

const score=prompt("Rate this worker (1-5)");

if(!score)return;

const rating=parseInt(score);

if(rating<1 || rating>5){

alert("Please enter a rating between 1 and 5.");

return;

}

try{

const res=await fetch(API+"/rate",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

id:id,

rating:rating

})

});

const data=await res.json();

alert(data.message || data.error);

}catch(err){

console.log(err);

alert("Rating failed.");

}

}

</script>

</body>

</html>
