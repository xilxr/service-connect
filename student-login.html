
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login - Service Connect</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #020617;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 420px;
  background: #0f172a;
  padding: 28px;
  border-radius: 20px;
  border: 1px solid #334155;
}

h1 {
  text-align: center;
  font-size: 25px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #94a3b8;
  font-size: 13px;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 13px;
  border: 1px solid #334155;
  border-radius: 10px;
  background: #020617;
  color: white;
  font-size: 14px;
}

input:focus {
  outline: none;
  border-color: #22c55e;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  color: #020617;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.switch {
  text-align: center;
  margin-top: 20px;
  font-size: 13px;
  color: #94a3b8;
}

.switch a {
  color: #4ade80;
  cursor: pointer;
  font-weight: bold;
}

#message {
  text-align: center;
  margin: 14px 0;
  font-size: 13px;
  min-height: 18px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="card">

  <h1>⚡ Service Connect</h1>
  <p class="subtitle">Student Account Portal</p>

  <form id="loginForm">
    <h2>Welcome Back</h2>

    <input
      id="loginPhone"
      type="tel"
      placeholder="Phone Number"
      autocomplete="tel"
      required
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
      required
    >

    <button id="loginButton" type="submit">
      Log In
    </button>

    <p class="switch">
      Don't have an account?
      <a onclick="showRegister()">Create Account</a>
    </p>
  </form>

  <form id="registerForm" class="hidden">
    <h2>Create Account</h2>

    <input
      id="registerName"
      placeholder="Full Name"
      autocomplete="name"
      required
    >

    <input
      id="registerPhone"
      type="tel"
      placeholder="Phone Number"
      autocomplete="tel"
      required
    >

    <input
      id="registerLocation"
      placeholder="Your Location (e.g. FUTO)"
      required
    >

    <input
      id="registerPassword"
      type="password"
      placeholder="Create Password (at least 8 characters)"
      autocomplete="new-password"
      minlength="8"
      required
    >

    <button id="registerButton" type="submit">
      Create Account
    </button>

    <p class="switch">
      Already have an account?
      <a onclick="showLogin()">Log In</a>
    </p>
  </form>

  <p id="message" role="status" aria-live="polite"></p>

</div>

<script>
const API = "https://service-backend-jezm.onrender.com";

const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");
const message = document.getElementById("message");

function showRegister() {
  loginForm.classList.add("hidden");
  registerForm.classList.remove("hidden");
  message.textContent = "";
}

function showLogin() {
  registerForm.classList.add("hidden");
  loginForm.classList.remove("hidden");
  message.textContent = "";
}

function showMessage(text, success = false) {
  message.textContent = text;
  message.style.color = success ? "#4ade80" : "#f87171";
}

function saveStudentSession(data) {
  if (!data.token || !data.student) {
    throw new Error("Invalid login response.");
  }

  localStorage.setItem("studentToken", data.token);
  localStorage.setItem("studentName", data.student.name);
  localStorage.setItem("studentPhone", data.student.phone);
  localStorage.setItem(
    "studentLocation",
    data.student.location || ""
  );
}

loginForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  const button = document.getElementById("loginButton");
  button.disabled = true;
  showMessage("Logging in...", true);

  try {
    const response = await fetch(API + "/student/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        phone: document.getElementById("loginPhone").value.trim(),
        password: document.getElementById("loginPassword").value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Login failed.");
    }

    saveStudentSession(data);

    showMessage("Login successful!", true);

    window.location.replace("student-v2.html");

  } catch (error) {
    showMessage(error.message || "Unable to log in.");
  } finally {
    button.disabled = false;
  }
});

registerForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  const button = document.getElementById("registerButton");
  button.disabled = true;
  showMessage("Creating account...", true);

  try {
    const phone = document.getElementById("registerPhone").value.trim();
    const password = document.getElementById("registerPassword").value;

    const response = await fetch(API + "/student/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name: document.getElementById("registerName").value.trim(),
        phone,
        location: document.getElementById("registerLocation").value.trim(),
        password
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Registration failed.");
    }

    document.getElementById("loginPhone").value = phone;
    document.getElementById("loginPassword").value = "";

    showLogin();
    showMessage(
      "Account created successfully! Please log in.",
      true
    );

  } catch (error) {
    showMessage(error.message || "Unable to create account.");
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
</html>
